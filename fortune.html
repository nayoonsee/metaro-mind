<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #05070f;
    color: #f2f4fb;
  }
  body { display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; position: relative; }

  .progress {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    height: 3px; background: rgba(255,255,255,0.15);
    max-width: 480px; margin: 0 auto;
  }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#5b6fd8,#dfe4fa); transition: width .3s; }

  .scene {
    position: relative; width: 100%; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden;
  }
  .scene-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 20%; z-index: 0;
    animation: kenburns 8s ease-out forwards;
  }
  @keyframes kenburns { from { transform: scale(1.06); } to { transform: scale(1); } }

  .back-btn {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(calc(-240px + 14px));
    z-index: 25; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(5,7,15,0.5); border: 1px solid rgba(255,255,255,0.2);
    color: #f2f4fb; display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
  }
  @media (max-width: 480px) { .back-btn { transform: none; left: 14px; } }
  .scene-overlay {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(5,7,15,0.1) 0%, rgba(5,7,15,0.15) 30%, rgba(5,7,15,0.72) 62%, rgba(5,7,15,0.97) 100%);
  }
  .scene-overlay.deep {
    background: linear-gradient(180deg, rgba(5,7,15,0.08) 0%, rgba(5,7,15,0.1) 22%, rgba(5,7,15,0.55) 45%, rgba(5,7,15,0.9) 66%, rgba(5,7,15,0.99) 100%);
  }
  .scene-content {
    position: relative; z-index: 2;
    padding: 24px 22px calc(108px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }

  .impact {
    font-family: 'Gugi', cursive;
    text-align: center; font-size: 30px; line-height: 1.4;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.8);
    margin: 8px 0 4px;
    animation: fadeUp .5s ease both;
  }
  .impact .accent { color: #a9b6f5; }

  .bubble {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    background: rgba(12,16,30,0.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px 20px 20px 4px;
    padding: 14px 18px; max-width: 88%;
    font-size: 16.5px; line-height: 1.6;
    animation: fadeUp .45s ease both;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .prompt {
    font-family: 'Gugi', cursive;
    font-size: 22px; margin: 4px 0 4px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }

  .panel {
    background: rgba(10,13,26,0.6); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 18px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  input[type=text], input[type=number], input[type=email] {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.35); color: #fff; font-size: 16px;
  }
  textarea {
    width: 100%; padding: 13px 14px; border-radius: 12px; min-height: 84px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.35); color: #fff; font-size: 15px; font-family: inherit; resize: vertical;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .choice-btn {
    width: 100%; text-align: left; padding: 13px 16px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.35); color: #f2f4fb; font-size: 15px;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  .choice-btn:hover, .choice-btn.selected { background: rgba(91,111,216,0.35); border-color: #8c9cf0; }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; padding: 10px; border-radius: 10px; text-align: center; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.35); font-size: 15px;
  }
  .toggle-btn.active { background: rgba(91,111,216,0.4); border-color: #8c9cf0; }

  /* Compact 2-col chip choices (topic screen) */
  .chip-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .chip-btn {
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 46px; padding: 5px 6px; border-radius: 11px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.35);
    color: #f2f4fb; font-size: 15px; line-height: 1.2; white-space: nowrap;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  .chip-btn:hover, .chip-btn.selected { background: rgba(91,111,216,0.35); border-color: #8c9cf0; }
  .chip-hint { font-size: 12px; color: #97a0cf; margin: 0 2px; }
  .panel-compact { padding: 8px 10px; gap: 6px; }
  .scene-content.content-tight { gap: 8px; }
  /* Input-step content group lifted ~44px off the bottom edge (button moves with it) */
  .scene-content.content-raised { padding-bottom: calc(152px + env(safe-area-inset-bottom)); }

  .cta-fixed {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; justify-content: center;
    padding: 14px 22px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, rgba(5,7,15,0.85) 35%, #05070f 85%);
  }
  .cta-fixed.cta-raised { bottom: 44px; }
  .cta-inner { width: 100%; max-width: 436px; display: flex; flex-direction: column; gap: 8px; }
  .primary-btn {
    font-family: 'Gugi', cursive;
    position: relative; width: 100%; padding: 15px; cursor: pointer;
    border: 1px solid #a9873f; border-radius: 4px;
    background: linear-gradient(180deg,#1c1408,#0d0a05);
    color: #e8caa0; font-size: 15px;
    letter-spacing: 1px;
    box-shadow: 0 0 0 1px rgba(169,135,63,0.25) inset, 0 6px 20px rgba(0,0,0,0.5);
    text-shadow: 0 1px 6px rgba(232,202,160,0.3);
  }
  .primary-btn::before, .primary-btn::after {
    content: ''; position: absolute; top: 4px; bottom: 4px; width: 1px;
    background: rgba(169,135,63,0.5);
  }
  .primary-btn::before { left: 8px; }
  .primary-btn::after { right: 8px; }
  .primary-btn:disabled { opacity: .5; cursor: not-allowed; }
  .ghost-btn {
    width: 100%; padding: 11px; border-radius: 12px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.25); color: #d6dafc; font-size: 13.5px; cursor: pointer;
  }
  /* Input-step CTAs only (scoped to .cta-fixed.cta-raised, which only input steps get —
     the reveal/error-retry screen's buildCta call opts out via {raised:false}, so it
     keeps the original .primary-btn styling untouched) */
  .cta-fixed.cta-raised .ghost-btn {
    height: 52px; padding: 0 16px; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .cta-fixed.cta-raised .primary-btn {
    height: 52px; padding: 0 16px;
    font-family: 'Gowun Batang', serif;
    font-size: 17px; font-weight: 600; letter-spacing: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10, 14, 28, 0.82);
    border: 1px solid rgba(205, 176, 105, 0.55);
    border-radius: 14px;
    color: #f3ead5;
    box-shadow: none;
    text-shadow: none;
    transition: border-color .15s, color .15s;
  }
  .cta-fixed.cta-raised .primary-btn::before, .cta-fixed.cta-raised .primary-btn::after { content: none; }
  .cta-fixed.cta-raised .primary-btn:disabled { opacity: 0.45; }
  .cta-fixed.cta-raised .primary-btn:not(:disabled):hover,
  .cta-fixed.cta-raised .primary-btn:not(:disabled):active {
    border-color: rgba(205, 176, 105, 0.85);
    color: #fbf3df;
  }
  .error { color: #ff9b9b; font-size: 13px; text-align: center; }
  .hidden { display: none !important; }

  .spinner-scene { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-bottom: 40px; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2); border-top-color: #a9b6f5;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pillar { text-align: center; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 10px 4px; border: 1px solid rgba(255,255,255,0.14); }
  .pillar .gz { font-size: 20px; font-weight: 700; }
  .pillar .label { font-size: 10.5px; color: #a9b3e0; margin-top: 3px; }
  .pillar .sub { font-size: 10px; color: #cbb98a; margin-top: 1px; }

  .reveal-page { display: flex; flex-direction: column; }
  .reveal-section {
    position: relative; width: 100%; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden; padding: 90px 22px 60px;
  }
  .reveal-section .r-content {
    position: relative; z-index: 2;
    opacity: 0; transform: translateY(24px);
    transition: opacity .7s ease, transform .7s ease;
    display: flex; flex-direction: column; gap: 12px;
  }
  .reveal-section.in-view .r-content { opacity: 1; transform: translateY(0); }
  .r-title {
    font-family: 'Gugi', cursive;
    font-size: 24px; text-shadow: 0 2px 14px rgba(0,0,0,0.8);
  }
  .r-body {
    font-size: 15.5px; line-height: 1.7; text-shadow: 0 1px 10px rgba(0,0,0,0.7);
  }
  .tease-blur { filter: blur(5px); user-select: none; }
  .tease-tag {
    display: inline-block; margin-left: 6px; font-size: 11.5px; color: #e8caa0;
    border: 1px solid rgba(169,135,63,0.5); border-radius: 999px; padding: 2px 8px;
    white-space: nowrap; vertical-align: middle; cursor: pointer;
  }
  .scroll-hint {
    text-align: center; font-size: 12.5px; color: #cbd3f5;
    margin-top: 8px;
    animation: bounce 1.6s ease-in-out infinite;
  }
  @keyframes bounce { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(6px); opacity: 1; } }

  .locked-card { position: relative; border-radius: 16px; overflow: hidden; }
  .locked-text { filter: blur(5px); user-select: none; line-height: 1.6; font-size: 14px; padding: 16px; background: rgba(12,16,30,0.72); }
  .lock-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,7,15,0.55); gap: 6px; font-size: 13px; color: #cbd3f5; text-align: center; padding: 0 20px;
  }
  .lock-overlay .icon { font-size: 24px; }
  .note { font-size: 11.5px; color: #97a0cf; text-align: center; line-height: 1.5; }

  /* ===== Opening sequence (scoped, does not affect other steps) ===== */
  .op-stage {
    position: relative; width: 100%; height: 100dvh; min-height: 100dvh;
    overflow: hidden; background: #000;
  }
  .op-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 18%;
    opacity: 0; transition: opacity 1.4s ease, transform 2.6s ease;
    transform: scale(1.05);
  }
  .op-layer.op-show { opacity: 1; transform: scale(1); }
  .op-layer.op-under { transition: none; opacity: 1; transform: scale(1); z-index: 1; }
  .op-layer.op-top { z-index: 2; }

  .op-blackout {
    position: absolute; inset: 0; z-index: 40; background: #000;
    opacity: 1; transition: opacity .4s ease;
    pointer-events: none;
  }
  .op-blackout.op-hide { opacity: 0; }

  .op-fog {
    position: absolute; inset: -10% -20%; z-index: 5; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 30% at 20% 85%, rgba(150,170,220,0.16), transparent 70%),
      radial-gradient(ellipse 50% 25% at 80% 90%, rgba(150,170,220,0.12), transparent 70%);
    animation: opFogDrift 14s ease-in-out infinite alternate;
  }
  @keyframes opFogDrift { from { transform: translateX(-3%); } to { transform: translateX(3%); } }

  /* Slot 1 only: one-sided cool moonlight across the dark close-up face */
  .op-layer.op-moonside { filter: brightness(1.10) contrast(1.05) saturate(1.04); }
  .op-sidelight {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 20% 32%, rgba(125,158,235,0.28) 0%, rgba(80,110,195,0.12) 30%, transparent 58%);
    mix-blend-mode: screen;
    opacity: 0; transition: opacity 1.1s ease;
  }
  .op-sidelight.op-show { opacity: 1; }

  .op-backlight {
    position: absolute; z-index: 3; pointer-events: none;
    left: 50%; top: 24%; width: 70%; height: 46%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(210,225,255,0.55), rgba(210,225,255,0.15) 45%, transparent 72%);
    opacity: 0; transition: opacity 1s ease;
    filter: blur(14px);
  }
  .op-backlight.op-show { opacity: 1; }
  .op-backlight.op-pulse { animation: opBacklightPulse .8s ease; }
  @keyframes opBacklightPulse { 0% { filter: blur(14px) brightness(1); } 45% { filter: blur(14px) brightness(1.6); } 100% { filter: blur(14px) brightness(1); } }

  .op-doorlight {
    position: absolute; z-index: 3; pointer-events: none;
    left: 50%; top: 46%; width: 55%; height: 42%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse, rgba(120,160,230,0.5), transparent 72%);
    opacity: 0; transition: opacity 1.1s ease;
    filter: blur(8px);
  }
  .op-doorlight.op-show { opacity: 1; }

  .op-fog.op-fog-burst {
    animation: opFogBurst 1.4s ease-out 1;
  }
  @keyframes opFogBurst {
    0% { opacity: .4; transform: translateY(12%); }
    50% { opacity: 1; }
    100% { opacity: .55; transform: translateY(0); }
  }


  .op-overlay {
    position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: linear-gradient(180deg, rgba(5,7,15,0.15) 0%, rgba(5,7,15,0.2) 40%, rgba(5,7,15,0.78) 72%, rgba(5,7,15,0.97) 100%);
  }

  .op-content {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 24px 22px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    text-align: center;
  }
  .op-title {
    font-family: 'Song Myung', serif;
    font-size: 34px; letter-spacing: 1px; line-height: 1.4;
    color: #fbf6ec;
    text-shadow: 0 2px 20px rgba(0,0,0,0.85), 0 0 18px rgba(200,60,70,0.25);
    filter: blur(8px); opacity: 0;
    transition: filter .6s ease, opacity .6s ease;
  }
  .op-title.op-show { filter: blur(0); opacity: 1; }
  .op-title .accent { color: #d7c48a; }
  .op-sub {
    font-family: 'Gowun Batang', serif;
    font-size: 17px; line-height: 1.6; color: #f1e9d8;
    max-width: 320px;
    filter: blur(6px); opacity: 0;
    transition: filter .6s ease, opacity .6s ease;
  }
  .op-sub.op-show { filter: blur(0); opacity: 1; }

  .op-shake { animation: opShake .18s ease; }
  @keyframes opShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }


  .op-bubble {
    font-family: 'Gowun Batang', serif;
    background: rgba(20, 12, 18, 0.78);
    border: 1px solid rgba(170, 40, 55, 0.55);
    border-radius: 16px;
    padding: 14px 20px;
    font-size: 16.5px; line-height: 1.6; color: #f4ece0;
    max-width: 90%;
    opacity: 0; transform: translateY(10px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .op-bubble.op-show { opacity: 1; transform: translateY(0); }

  .op-gate-btn {
    font-family: 'Song Myung', serif;
    position: relative;
    width: 92%; max-width: 420px; height: 88px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 44px;
    font-size: clamp(18px, 5.6vw, 25px); white-space: nowrap; letter-spacing: 1px; color: #f3ddb8;
    background: linear-gradient(160deg, #861f29 0%, #65141c 45%, #3a080d 100%);
    border-radius: 6px;
    border: 1px solid #7a5a2c;
    box-shadow:
      inset 0 0 0 1px rgba(243,221,184,0.18),
      inset 0 2px 10px rgba(255,180,150,0.12),
      0 10px 28px rgba(0,0,0,0.55);
    cursor: pointer;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    opacity: 0; transform: translateY(10px);
    transition: opacity .6s ease, transform .6s ease;
    overflow: hidden;
  }
  .op-gate-btn.op-show { opacity: 1; transform: translateY(0); }
  .op-gate-btn:active, .op-gate-btn.op-pressed { transform: scale(0.98); box-shadow: inset 0 0 0 1px rgba(243,221,184,0.18), inset 0 4px 16px rgba(0,0,0,0.5); transition: transform .15s ease, box-shadow .15s ease; }
  .op-gate-btn::before {
    content: ''; position: absolute; inset: 6px;
    border: 1px solid rgba(243,221,184,0.28); border-radius: 3px; pointer-events: none;
  }
  .op-gate-btn .op-corner {
    position: absolute; width: 20px; height: 20px; opacity: .8; pointer-events: none;
  }
  .op-gate-btn .op-corner svg { width: 100%; height: 100%; }
  .op-gate-btn .op-corner-l { left: 12px; top: 50%; transform: translateY(-50%); }
  .op-gate-btn .op-corner-r { right: 12px; top: 50%; transform: translateY(-50%) scaleX(-1); }
  .op-gate-btn .op-sheen {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 40%, rgba(255,220,180,0.22) 50%, transparent 60%);
    background-size: 250% 100%; background-position: 120% 0;
    animation: opSheen 3.2s ease-in-out infinite;
  }
  @keyframes opSheen { 0%, 70% { background-position: 120% 0; } 100% { background-position: -20% 0; } }

  .op-mute-btn {
    position: absolute; z-index: 30;
    top: calc(14px + env(safe-area-inset-top)); right: 14px;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(5,7,15,0.55); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0; transition: opacity .4s ease;
  }
  .op-mute-btn.op-show { opacity: 1; }
  .op-mute-btn svg { width: 20px; height: 20px; }
  .op-mute-btn .op-mute-x { opacity: 0; }
  .op-mute-btn .op-mute-wave { opacity: 1; }
  .op-mute-btn.op-muted .op-mute-x { opacity: 1; }
  .op-mute-btn.op-muted .op-mute-wave { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .op-layer, .op-title, .op-sub, .op-bubble, .op-gate-btn { transition-duration: .15s !important; }
    .op-fog, .op-sheen, .op-gate-btn .op-sheen { animation: none !important; }
    .op-shake { animation: none !important; }
  }

  /* Gate-open title beat (fits inside existing open-gate hold; no timing changes) */
  .op-eyebrow {
    font-family: 'Gowun Batang', serif;
    font-size: 13px; letter-spacing: 2px; color: #cbd3f5;
    opacity: 0; transform: translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .op-eyebrow.op-show { opacity: .85; transform: translateY(0); }
  .op-title2 {
    font-family: 'Song Myung', serif;
    font-size: 28px; letter-spacing: 1px; color: #fbf6ec;
    text-shadow: 0 2px 16px rgba(0,0,0,0.75);
    opacity: 0; transform: translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .op-title2.op-show { opacity: 1; transform: translateY(0); }
  .op-sub2 {
    font-family: 'Gowun Batang', serif;
    font-size: 14px; color: #e7e0d2;
    opacity: 0; transform: translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .op-sub2.op-show { opacity: .92; transform: translateY(0); }

  /* ===== New input-step dialogue line (현담 대사) ===== */
  .hd-line {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    background: rgba(12,16,30,0.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px 20px 20px 4px;
    padding: 14px 18px; max-width: 88%;
    font-size: 18px; line-height: 1.5;
    animation: fadeUp .45s ease both;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .hd-line.hd-line-compact {
    padding: 9px 14px; font-size: 18px; line-height: 1.35;
  }

  /* ===== Reading/loading sequence ===== */
  .load-content {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 24px 22px calc(40px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center;
  }
  .load-line {
    font-family: 'Gowun Batang', serif;
    font-size: 15.5px; color: #e7e0d2; line-height: 1.6; opacity: .9;
  }
  .load-caption {
    font-family: 'Song Myung', serif;
    font-size: 20px; color: #fbf6ec; letter-spacing: .5px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.75);
    opacity: 0; transition: opacity .35s ease;
    min-height: 28px;
  }
  .load-caption.load-found { color: #e8caa0; }
</style>
</head>
<body>
<div class="app">
  <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="sceneRoot"></div>
</div>

<script>
const STEPS = ['intro','name','topic','concern','birth','birthtime','loading','reveal'];
const INPUT_STEPS = new Set(['name','topic','concern','birth','birthtime']);
const NO_BACK_STEPS = new Set(['intro','loading']);
let stepIndex = 0;
const state = {
  name: '', gender: '여성', calendar: 'solar',
  year: '', month: '', day: '', hour: '', minute: '',
  topic: '', relSub: '', jobSubs: [],
  relationshipStatus: '', jobStatus: '', question: '',
};

function opPath(folder, file) {
  return '/characters/' + encodeURIComponent(folder) + '/' + encodeURIComponent(file);
}

const SCENE_IMAGE = {
  intro: '/characters/hyundam-reveal.webp',
  name: opPath('현담_최종이미지_2부', '07_달빛과_방울_대표얼굴.png'),
  topic: opPath('현담_최종이미지_1부', '04_초승달_매혹표정.png'),
  concern: opPath('현담_최종이미지_2부', '09_방울을_든_앉은자세.png'),
  birth: opPath('현담_최종이미지_1부', '03_오드아이_발광_클로즈업.png'),
  birthtime: opPath('현담_최종이미지_2부', '08_붓으로_사주읽기.png'),
  reveal: '/characters/hyundam-reveal.webp',
};

const sceneRoot = document.getElementById('sceneRoot');
const progressFill = document.getElementById('progressFill');

function setProgress() {
  const pct = Math.round((stepIndex / (STEPS.length - 2)) * 100);
  progressFill.style.width = Math.min(pct, 100) + '%';
}

function goTo(name) {
  stepIndex = STEPS.indexOf(name);
  setProgress();
  render();
}

function next() {
  stepIndex = Math.min(stepIndex + 1, STEPS.length - 1);
  setProgress();
  render();
}

function el(html) {
  const div = document.createElement('div');
  div.innerHTML = html.trim();
  return div.firstElementChild;
}

function buildScene(step) {
  const overlayClass = INPUT_STEPS.has(step) ? ' deep' : '';
  const raisedClass = INPUT_STEPS.has(step) ? ' content-raised' : '';
  const scene = el(`
    <div class="scene">
      <img class="scene-bg" src="${SCENE_IMAGE[step]}" alt="" />
      <div class="scene-overlay${overlayClass}"></div>
      <div class="scene-content${raisedClass}" id="content"></div>
    </div>
  `);
  if (!NO_BACK_STEPS.has(step) && stepIndex > 0) {
    const back = el('<button class="back-btn" aria-label="뒤로">‹</button>');
    back.onclick = () => {
      stepIndex = Math.max(0, stepIndex - 1);
      setProgress();
      render();
    };
    scene.appendChild(back);
  }
  return scene;
}

function buildCta(label, onClick, opts = {}) {
  const raisedClass = opts.raised === false ? '' : ' cta-raised';
  const wrap = el(`
    <div class="cta-fixed${raisedClass}">
      <div class="cta-inner">
        ${opts.ghostLabel ? `<button class="ghost-btn" id="ghostBtn">${opts.ghostLabel}</button>` : ''}
        <button class="primary-btn" id="ctaBtn">${label}</button>
      </div>
    </div>
  `);
  wrap.querySelector('#ctaBtn').onclick = onClick;
  if (opts.ghostLabel) wrap.querySelector('#ghostBtn').onclick = opts.onGhost;
  return wrap;
}

function render() {
  const step = STEPS[stepIndex];
  document.body.style.overflow = '';
  document.documentElement.style.overflow = '';
  sceneRoot.innerHTML = '';
  if (step === 'reveal') { renderRevealPage(); return; }
  if (step === 'intro') { renderOpeningSequence(); return; }
  if (step === 'loading') { renderLoadingSequence(); return; }
  const scene = buildScene(step);
  sceneRoot.appendChild(scene);
  const content = scene.querySelector('#content');
  const renderers = {
    name: renderName,
    topic: renderTopic,
    concern: renderConcern,
    birth: renderBirth,
    birthtime: renderBirthtime,
  };
  renderers[step](content, scene);
}

const OP_IMG = {
  moon: opPath('현담_최종이미지_2부', '13_보름달_전신.webp'),
  eye: opPath('현담_최종이미지_1부', '03_오드아이_발광_클로즈업.webp'),
  invite: opPath('현담_최종이미지_2부', '12_손을_내미는_초대.webp'),
  gateClosed: opPath('현담_최종이미지_2부', '10_닫힌_신당입구.webp'),
  gateOpen: opPath('현담_최종이미지_2부', '11_열린_신당입구.webp'),
  leading: opPath('현담_최종이미지_1부', '01_신당으로_이끄는_전신.webp'),
};

const OP_AUDIO_SRC = {
  bell: '/audio/shrine-bell.mp3',
  wind: '/audio/shrine-wind.mp3',
  creak: '/audio/shrine-door-creak.mp3',
};
const OP_AUDIO_VOL = { bell: 0.22, creak: 0.24, wind: 0.10 };

const MUTE_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 9v6h4l5 5V4L8 9H4Z" fill="#f2f4fb"/><path class="op-mute-x" d="M16 9l5 6M21 9l-5 6" stroke="#f2f4fb" stroke-width="1.6" stroke-linecap="round"/><path class="op-mute-wave" d="M16.5 8.5c1.8 1.8 1.8 5.2 0 7" stroke="#f2f4fb" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>';

function renderOpeningSequence() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';

  const stage = el(`
    <div class="op-stage">
      <img class="op-layer" id="opImg" src="${OP_IMG.eye}" alt="" />
      <div class="op-fog" id="opFog"></div>
      <div class="op-sidelight" id="opSidelight"></div>
      <div class="op-backlight" id="opBacklight"></div>
      <div class="op-doorlight" id="opDoorlight"></div>
      <div class="op-overlay"></div>
      <div class="op-content" id="opContent"></div>
      <div class="op-blackout" id="opBlackout"></div>
      <button class="op-mute-btn" id="opMuteBtn" aria-label="음소거">${MUTE_SVG}</button>
    </div>
  `);
  sceneRoot.appendChild(stage);

  const opImg = stage.querySelector('#opImg');
  const opContent = stage.querySelector('#opContent');
  const opBlackout = stage.querySelector('#opBlackout');
  const opBacklight = stage.querySelector('#opBacklight');
  const opSidelight = stage.querySelector('#opSidelight');
  const opFog = stage.querySelector('#opFog');
  const opDoorlight = stage.querySelector('#opDoorlight');
  const muteBtn = stage.querySelector('#opMuteBtn');

  // ---- Audio (lazily created; missing files fail silently) ----
  let muted = false;
  const sfx = {
    bell: new Audio(OP_AUDIO_SRC.bell),
    wind: new Audio(OP_AUDIO_SRC.wind),
    creak: new Audio(OP_AUDIO_SRC.creak),
  };
  sfx.bell.volume = OP_AUDIO_VOL.bell;
  sfx.creak.volume = OP_AUDIO_VOL.creak;
  sfx.wind.volume = OP_AUDIO_VOL.wind;
  sfx.wind.loop = true;
  Object.values(sfx).forEach((a) => { a.preload = 'auto'; a.addEventListener('error', () => {}); });

  function unlockAudio() {
    // Mobile browsers require each element to be touched inside a user gesture once.
    Object.values(sfx).forEach((a) => {
      try {
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
        a.pause();
        a.currentTime = 0;
      } catch (e) {}
    });
  }
  function playSfx(name) {
    if (muted) return;
    try {
      const a = sfx[name];
      a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function fadeOutWind(ms) {
    try {
      const a = sfx.wind;
      const startVol = a.volume;
      const steps = 10;
      const stepMs = ms / steps;
      let i = 0;
      const iv = setInterval(() => {
        i++;
        a.volume = Math.max(0, startVol * (1 - i / steps));
        if (i >= steps) { clearInterval(iv); a.pause(); a.currentTime = 0; }
      }, stepMs);
    } catch (e) {}
  }
  muteBtn.onclick = () => {
    muted = !muted;
    Object.values(sfx).forEach((a) => { a.muted = muted; });
    muteBtn.classList.toggle('op-muted', muted);
  };

  const timers = [];
  const after = (ms, fn) => { timers.push(setTimeout(fn, ms)); };
  function cleanup() {
    timers.forEach(clearTimeout);
    stage.removeEventListener('click', skipLeading);
  }
  function proceed() {
    cleanup();
    Object.values(sfx).forEach((a) => { try { a.pause(); } catch (e) {} });
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
    next();
  }

  const OP_EASE = 'cubic-bezier(0.33, 0, 0.2, 1)'; // slow start, slow end — no abrupt snap

  // Sequential fade (image dips through transparent) — used for quick cuts.
  function crossfadeTo(newSrc, opts = {}) {
    const outMs = opts.outMs != null ? opts.outMs : (opts.fadeMs || 500);
    const inMs = opts.inMs != null ? opts.inMs : (opts.fadeMs || 500);
    opImg.style.transition = `opacity ${outMs}ms ${OP_EASE}`;
    opImg.style.opacity = '0';
    after(outMs, () => {
      opImg.src = newSrc;
      const zoomMs = opts.zoomMs || inMs;
      opImg.style.transition = `opacity ${inMs}ms ${OP_EASE}, transform ${zoomMs}ms ${OP_EASE}`;
      requestAnimationFrame(() => {
        opImg.style.opacity = '1';
        if (opts.zoomTo) opImg.style.transform = `scale(${opts.zoomTo})`;
      });
    });
  }

  // True simultaneous crossfade via a temporary overlay layer (no dark dip).
  function trueCrossfadeTo(newSrc, ms, opts = {}) {
    const overlay = document.createElement('img');
    overlay.className = 'op-layer op-top';
    overlay.alt = '';
    overlay.style.opacity = '0';
    overlay.style.transform = 'scale(1)';
    const zoomMs = opts.zoomMs || ms;
    overlay.style.transition = `opacity ${ms}ms ${OP_EASE}, transform ${zoomMs}ms ${OP_EASE}`;
    overlay.src = newSrc;
    stage.insertBefore(overlay, opFog);
    requestAnimationFrame(() => {
      overlay.style.opacity = '1';
      if (opts.zoomTo) overlay.style.transform = `scale(${opts.zoomTo})`;
    });
    after(ms, () => {
      opImg.style.transition = 'none';
      opImg.src = newSrc;
      opImg.style.opacity = '1';
      if (opts.zoomTo) opImg.style.transform = `scale(${opts.zoomTo})`;
      overlay.remove();
    });
  }

  function skipLeading() { proceed(); }

  if (reduced) {
    // Reduced motion: minimal, fast, no shake/zoom/looping fog/audio-heavy cues
    opFog.style.display = 'none';
    opImg.classList.add('op-show'); // already src=eye from template
    opContent.innerHTML = `
      <div class="op-title op-show">네 <span class="accent">운명</span>, 내가<br/>가감 없이 읽어줄게</div>
      <div class="op-sub op-show">현담이야. 여기까지 왔다는 건 뭔가 걸리는 게 있다는 거겠지. 숨기지 말고 다 말해봐.</div>
    `;
    opBlackout.classList.add('op-hide');
    after(900, () => {
      opContent.innerHTML = '';
      opImg.src = OP_IMG.invite;
      opContent.innerHTML = `
        <div class="op-bubble op-show">왔군. 네 운명이 문 앞에서 기다리고 있어.</div>
      `;
      const btn = el(`<button class="op-gate-btn op-show">현담의 신당으로 들어가기</button>`);
      btn.onclick = () => {
        btn.disabled = true;
        unlockAudio();
        playSfx('bell');
        muteBtn.classList.add('op-show');
        opBlackout.classList.remove('op-hide');
        after(200, () => {
          opImg.src = OP_IMG.leading;
          opContent.innerHTML = `<div class="op-bubble op-show">따라와. 네 사주는 안쪽에서 보지.</div>`;
          opBlackout.classList.add('op-hide');
          stage.addEventListener('click', skipLeading);
          after(800, proceed);
        });
      };
      opContent.appendChild(btn);
    });
    return;
  }

  // ================= Slot 1: 4.2s + 1.5s = 5.7s, title + subcopy (문구/타이밍 그대로, 이미지만 eye) =================
  after(300, () => opBlackout.classList.add('op-hide'));
  after(350, () => {
    opImg.classList.add('op-show'); // 1.4s opacity fade / 2.6s slow scale (opImg already src=eye)
    opImg.classList.add('op-moonside');
    opSidelight.classList.add('op-show');
  });

  after(1100, () => {
    const title = el(`<div class="op-title">네 <span class="accent">운명</span>, 내가<br/>가감 없이 읽어줄게</div>`);
    opContent.appendChild(title);
    requestAnimationFrame(() => title.classList.add('op-show'));
  });
  after(1500, () => {
    const sub = el(`<div class="op-sub">현담이야. 여기까지 왔다는 건 뭔가 걸리는 게 있다는 거겠지. 숨기지 말고 다 말해봐.</div>`);
    opContent.appendChild(sub);
    requestAnimationFrame(() => sub.classList.add('op-show'));
  });

  // ================= Slot 2: 인물 뒤에서 빛이 뿜어져 나오는 백라이트 효과, 이미지는 moon =================
  // (4200 + 500ms net hold on Slot 1 = 4700; Slot1 최종 유지시간 4.7s)
  after(4700, () => {
    opContent.innerHTML = '';
    opImg.classList.remove('op-moonside');
    opSidelight.classList.remove('op-show');
    crossfadeTo(OP_IMG.moon, { fadeMs: 900 });
    after(1200, () => { // (900ms swap + 300ms settle) light builds gradually behind him
      opBacklight.classList.add('op-show');
      after(700, () => { // then flares once
        opBacklight.classList.add('op-pulse');
      });
    });
  });

  // ================= Phase 3: invitation (12_손을_내미는_초대, waits for tap) =================
  // (8400 + 500ms net carried over from Slot 1 = 8900)
  after(8900, () => {
    opBacklight.classList.remove('op-show', 'op-pulse');
    crossfadeTo(OP_IMG.invite, { outMs: 400, inMs: 1200 });
    after(400, () => {
      const bubble = el(`<div class="op-bubble">왔군. 네 운명이 문 앞에서 기다리고 있어.</div>`);
      opContent.appendChild(bubble);
      requestAnimationFrame(() => bubble.classList.add('op-show'));
      after(500, () => {
        const btn = el(`<button class="op-gate-btn"><span class="op-sheen"></span><span class="op-corner op-corner-l">${MOON_SVG}</span>현담의 신당으로 들어가기<span class="op-corner op-corner-r">${MOON_SVG}</span></button>`);
        opContent.appendChild(btn);
        requestAnimationFrame(() => btn.classList.add('op-show'));
        btn.onclick = () => {
          btn.disabled = true;
          btn.style.pointerEvents = 'none';
          btn.classList.add('op-pressed');
          unlockAudio();
          playSfx('bell');
          muteBtn.classList.add('op-show');
          after(150, () => enterShrine());
        };
      });
    });
  });

  function enterShrine() {
    // Flat, non-overlapping schedule (all offsets relative to this call)
    opContent.innerHTML = '';
    opBlackout.style.transitionDuration = '0.45s';
    opBlackout.classList.remove('op-hide'); // t=0: screen darkens over 0.45s

    after(450, () => { // black is now opaque: swap to closed gate unseen
      opImg.style.transition = 'none';
      opImg.src = OP_IMG.gateClosed;
      opImg.style.opacity = '0';
      opImg.style.transform = 'scale(1)';
      requestAnimationFrame(() => {
        opImg.style.transition = `opacity 1300ms ${OP_EASE}, transform 2600ms ${OP_EASE}`;
        opImg.style.opacity = '1';
        opImg.style.transform = 'scale(1.03)'; // very slow, barely-there zoom
      });
      opBlackout.style.transitionDuration = '0.35s';
      opBlackout.classList.add('op-hide');
      playSfx('wind');
    });

    // closed door fully visible at 450+1300=1750; hold 1.2s
    // light seeps through the door crack BEFORE it opens (no abrupt cut)
    after(2950, () => {
      opDoorlight.classList.add('op-show');
    });
    after(3250, () => {
      playSfx('creak');
    });

    // 0.4s after creak starts, begin the slow crossfade to the open gate
    after(3650, () => {
      opDoorlight.classList.remove('op-show');
      trueCrossfadeTo(OP_IMG.gateOpen, 2600, { zoomTo: 1.07, zoomMs: 3800 });
    });

    // open gate fully visible at 3650+2600=6250.
    // Title beat: eyebrow -> title -> subtitle stagger in fast (200ms apart), then the
    // complete 3-line state holds for 2.2s before the leading crossfade starts. Net added
    // time vs. the original 7450ms crossfade start is 1.9s (under the 2s budget).
    after(6250, () => {
      const eyebrow = el(`<div class="op-eyebrow">운명을 기록하는 안내자</div>`);
      opContent.appendChild(eyebrow);
      requestAnimationFrame(() => eyebrow.classList.add('op-show'));
    });
    after(6450, () => {
      const title2 = el(`<div class="op-title2">현담의 명식첩</div>`);
      opContent.appendChild(title2);
      requestAnimationFrame(() => title2.classList.add('op-show'));
    });
    after(6650, () => {
      const sub2 = el(`<div class="op-sub2">네 사주에 숨은 흐름을 읽다</div>`);
      opContent.appendChild(sub2);
      requestAnimationFrame(() => sub2.classList.add('op-show'));
    });
    // all three lines fully visible by 6650+500=7150; hold complete state for 2.2s -> 9350

    // leading scene keeps drifting inward the whole time it's held (feels like walking in together)
    after(9350, () => {
      opContent.innerHTML = '';
      trueCrossfadeTo(OP_IMG.leading, 1400, { zoomTo: 1.05, zoomMs: 3400 });
    });

    // leading scene fully visible at 9350+1400=10750; hold 2s (auto) / tap to skip
    after(10750, () => {
      const bubble = el(`<div class="op-bubble">따라와. 네 사주는 안쪽에서 보지.</div>`);
      opContent.appendChild(bubble);
      requestAnimationFrame(() => bubble.classList.add('op-show'));
      stage.addEventListener('click', skipLeading);
      fadeOutWind(1000);
      after(2000, proceed);
    });
  }
}

const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 3.5C11 3.5 7 7.8 7 12s4 8.5 9 8.5c-6.5-1-9.5-6-9.5-8.5S9.5 4.5 16 3.5Z" fill="#e8caa0" opacity="0.9"/></svg>';

function renderName(content, scene) {
  content.appendChild(el('<div class="hd-line">이름부터. 오늘 밤엔 뭐라고 불러줄까?</div>'));
  const panel = el('<div class="panel"></div>');
  const input = el('<input type="text" placeholder="이름 또는 별명" />');
  input.value = state.name;
  panel.appendChild(input);
  content.appendChild(panel);
  scene.appendChild(buildCta('다음', () => {
    state.name = input.value.trim() || '손님';
    next();
  }));
  setTimeout(() => input.focus(), 50);
}

const JOB_OPTS = ['직장인', '사업·프리랜서', '취업·이직 준비', '학생', '말하고 싶지 않음'];

function renderTopic(content, scene) {
  content.classList.add('content-tight');
  const hdLine = el(`<div class="hd-line hd-line-compact">좋아, ${state.name || '손님'}. 오늘 네가 알고 싶은 건 어느 쪽이지?</div>`);
  content.appendChild(hdLine);

  const panel = el('<div class="panel panel-compact"></div>');
  const chipGrid = el('<div class="chip-grid"></div>');
  const topics = ['인연과 연애', '지나간 사람과의 재회', '돈과 일', '관계와 선택', '앞으로의 전체 흐름'];
  topics.forEach((t) => {
    const b = el(`<div class="chip-btn ${state.topic === t ? 'selected' : ''}">${t}</div>`);
    b.onclick = () => {
      state.topic = t;
      if (t !== '인연과 연애' && t !== '지나간 사람과의 재회') { state.relSub = ''; state.relationshipStatus = ''; }
      if (t !== '돈과 일') { state.jobSubs = []; state.jobStatus = ''; }
      render();
    };
    chipGrid.appendChild(b);
  });
  panel.appendChild(chipGrid);
  content.appendChild(panel);

  const isLove = state.topic === '인연과 연애' || state.topic === '지나간 사람과의 재회';
  const isMoney = state.topic === '돈과 일';
  let subPanel = null;

  if (isLove) {
    subPanel = el('<div class="panel panel-compact"></div>');
    const grid = el('<div class="chip-grid"></div>');
    ['솔로', '썸 또는 애매한 관계', '연애 중', '이별 후', '말하고 싶지 않음'].forEach((o) => {
      const b = el(`<div class="chip-btn ${state.relSub === o ? 'selected' : ''}">${o}</div>`);
      b.onclick = () => {
        state.relSub = o;
        state.relationshipStatus = (o === '말하고 싶지 않음') ? '' : o;
        render();
      };
      grid.appendChild(b);
    });
    subPanel.appendChild(grid);
    content.appendChild(subPanel);
  } else if (isMoney) {
    subPanel = el('<div class="panel panel-compact"></div>');
    subPanel.appendChild(el('<div class="chip-hint">복수 선택 가능</div>'));
    const grid = el('<div class="chip-grid"></div>');
    JOB_OPTS.forEach((o) => {
      const selected = state.jobSubs.includes(o);
      const b = el(`<div class="chip-btn ${selected ? 'selected' : ''}">${o}</div>`);
      b.onclick = () => {
        if (o === '말하고 싶지 않음') {
          state.jobSubs = state.jobSubs.includes(o) ? [] : [o];
        } else {
          state.jobSubs = state.jobSubs.filter((x) => x !== '말하고 싶지 않음');
          if (state.jobSubs.includes(o)) {
            state.jobSubs = state.jobSubs.filter((x) => x !== o);
          } else {
            state.jobSubs.push(o);
          }
        }
        state.jobStatus = state.jobSubs.join(' / ');
        render();
      };
      grid.appendChild(b);
    });
    subPanel.appendChild(grid);
    content.appendChild(subPanel);
  }

  const needsSub = isLove || isMoney;
  const subSelected = isLove ? !!state.relSub : (isMoney ? state.jobSubs.length > 0 : true);
  const canProceed = !!state.topic && (!needsSub || subSelected);

  const cta = buildCta('다음', next);
  if (!canProceed) cta.querySelector('#ctaBtn').disabled = true;
  scene.appendChild(cta);

  if (subPanel) {
    requestAnimationFrame(() => {
      const rect = subPanel.getBoundingClientRect();
      if (rect.bottom > window.innerHeight - 90 || rect.top < 0) {
        subPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }
}

function renderConcern(content, scene) {
  content.appendChild(el('<div class="hd-line">하나만 말해봐. 자꾸 마음이 돌아가는 그 지점.</div>'));
  const panel = el('<div class="panel"></div>');
  const ta = el('<textarea placeholder="예: 그 사람과 다시 이어질 수 있을까?"></textarea>');

  panel.appendChild(ta);
  content.appendChild(panel);

}

  panel.appendChild(row);

    b.onclick = () => { state.gender = g; render(); };
    genderRow.appendChild(b);
  });
  const calRow = el('<div class="toggle-row"></div>');
  [['solar', '양력'], ['lunar', '음력']].forEach(([v, label]) => {
    const b = el(`<div class="toggle-btn ${state.calendar === v ? 'active' : ''}">${label}</div>`);
    b.onclick = () => { state.calendar = v; render(); };

  });

  panel.appendChild(calRow);

      errorBox.textContent = '년/월/일을 모두 입력해줘.';
      errorBox.classList.remove('hidden');
      return;
    }
    state.year = y.value; state.month = mo.value; state.day = d.value;
    next();
  }));
}

function renderBirthtime(content, scene) {
  content.appendChild(el('<div class="hd-line">시간까지 알면 흐름이 더 선명해져. 몰라도 괜찮아.</div>'));
  const panel = el('<div class="panel"></div>');
  const row = el('<div class="row"></div>');

  h.value = state.hour; m.value = state.minute;
  row.appendChild(h); row.appendChild(m);
  panel.appendChild(row);
  content.appendChild(panel);
  scene.appendChild(buildCta('내 운명 읽기', () => {
    state.hour = h.value; state.minute = m.value;
    goTo('loading');
  }, {
    ghostLabel: '시간 몰라',
    onGhost: () => { state.hour = ''; state.minute = ''; goTo('loading'); },
  }));
}

let resultData = null;
let fetchError = null;
let fetchInFlight = false;

function buildPayload() {
  const payload = {
    name: state.name, gender: state.gender, calendar: state.calendar,
    year: Number(state.year), month: Number(state.month), day: Number(state.day),
    relationshipStatus: state.relationshipStatus, jobStatus: state.jobStatus,
    question: [state.topic, state.question].filter(Boolean).join(' - '),
  };
  if (state.hour !== '') payload.hour = Number(state.hour);
  if (state.minute !== '') payload.minute = Number(state.minute);
  return payload;
}

async function doFetch(signal) {
  if (fetchInFlight) return;
  fetchInFlight = true;
  try {
    const res = await fetch('/api/teaser', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildPayload()),
      signal,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '분석에 실패했어.');
    resultData = data;
    fetchError = null;
  } catch (err) {
    fetchError = err.name === 'AbortError' ? '응답이 너무 오래 걸려서 멈췄어. 다시 시도해줘.' : err.message;
    resultData = null;
  } finally {
    fetchInFlight = false;
  }
}

const LOADING_STAGES = [
  { img: opPath('현담_최종이미지_2부', '08_붓으로_사주읽기.png'), caption: '명식을 펼치는 중' },
  { img: opPath('현담_최종이미지_1부', '02_손가락으로_사주읽기.png'), caption: '오행의 기울기를 살피는 중' },
  { img: opPath('현담_최종이미지_1부', '05_월호명식첩_펼치기.png'), caption: '운이 꺾이는 시기를 찾는 중' },
  { img: opPath('현담_최종이미지_1부', '03_오드아이_발광_클로즈업.png'), caption: '네 고민과 흐름을 맞춰보는 중' },
];

function renderLoadingSequence() {
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';

  const stage = el(`
    <div class="op-stage">
      <img class="op-layer op-show" id="loadImg" src="${LOADING_STAGES[0].img}" alt="" />
      <div class="op-overlay"></div>
      <div class="load-content">
        <div class="load-line">잠깐만. 지금 네 명식을 보고 있어.</div>
        <div class="load-caption" id="loadCaption">${LOADING_STAGES[0].caption}</div>
      </div>
    </div>
  `);
  sceneRoot.appendChild(stage);

  const loadImg = stage.querySelector('#loadImg');
  const loadCaption = stage.querySelector('#loadCaption');
  loadImg.style.transition = 'opacity 450ms ease';
  requestAnimationFrame(() => { loadCaption.style.opacity = '1'; });

  const STAGE_MS = 1625; // each scene holds >=1.6s before the next crossfade begins
  const FADE_OVERHEAD = 600; // showStage's internal 450ms image fade + 150ms caption delay
  const MIN_MS = STAGE_MS * LOADING_STAGES.length; // ~6.5s total minimum
  let stopped = false;
  const cycleTimers = [];

  function showStage(i) {
    const st = LOADING_STAGES[i];
    loadImg.style.opacity = '0';
    setTimeout(() => {
      if (stopped) return;
      loadImg.src = st.img;
      loadCaption.style.opacity = '0';
      requestAnimationFrame(() => {
        loadImg.style.opacity = '1';
        setTimeout(() => {
          if (stopped) return;
          loadCaption.textContent = st.caption;
          requestAnimationFrame(() => { loadCaption.style.opacity = '1'; });
        }, 150);
      });
    }, 450);
  }

  // Schedule each transition to START `FADE_OVERHEAD` early, so the caption itself
  // becomes visible exactly on the n*STAGE_MS mark (each scene then holds a clean
  // STAGE_MS before the next). The 4th scene is never re-triggered — it just holds
  // until minDelay/the API resolves (no looping back to scene 1).
  for (let i = 1; i < LOADING_STAGES.length; i++) {
    const triggerAt = Math.max(0, i * STAGE_MS - FADE_OVERHEAD);
    cycleTimers.push(setTimeout(() => { if (!stopped) showStage(i); }, triggerAt));
  }

  const TIMEOUT_MS = 45000; // hard cap: fall back to the error/retry screen past this
  const controller = new AbortController();
  const timeoutTimer = setTimeout(() => controller.abort(), TIMEOUT_MS);

  let fetchSettled = false;
  const fetchPromise = doFetch(controller.signal).then(() => { fetchSettled = true; });
  const minDelay = new Promise((resolve) => setTimeout(resolve, MIN_MS));

  // Past the normal 4-scene walkthrough, if the API still hasn't answered, swap to a
  // dedicated "still waiting" line instead of holding the last scene's caption forever.
  minDelay.then(() => {
    if (stopped || fetchSettled) return;
    loadCaption.style.opacity = '0';
    setTimeout(() => {
      if (stopped || fetchSettled) return;
      loadCaption.textContent = '거의 다 봤어. 마지막 흐름을 확인하는 중이야.';
      requestAnimationFrame(() => { loadCaption.style.opacity = '1'; });
    }, 300);
  });

  Promise.all([fetchPromise, minDelay]).then(() => {
    stopped = true;
    clearTimeout(timeoutTimer);
    cycleTimers.forEach(clearTimeout);
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
    if (fetchError) {
      goTo('reveal');
      return;
    }
    loadCaption.style.opacity = '0';
    setTimeout(() => {
      loadCaption.textContent = '찾았다.';
      loadCaption.classList.add('load-found');
      requestAnimationFrame(() => { loadCaption.style.opacity = '1'; });
      setTimeout(() => { goTo('reveal'); }, 800);
    }, 300);
  });
}

const REVEAL_CYCLE = ['hyundam-reveal.webp', 'hyundam-avatar.webp', 'hyundam-dialogue.webp', 'hyundam-focus.webp'];

function teaseBody(body) {
  const match = body.match(/^(.{8,60}?[.!?…])\s*(.*)$/s);
  if (!match) return `<div class="r-body">${body}</div>`;
  const [, visible, rest] = match;
  if (!rest) return `<div class="r-body">${visible}</div>`;
  return `<div class="r-body">${visible} <span class="tease-blur">${rest}</span><span class="tease-tag">🔒 이어보기</span></div>`;
}

function buildRevealSection(imgSrc, innerHtml, extraClass) {
  const section = el(`
    <div class="reveal-section${extraClass ? ' ' + extraClass : ''}">
      <img class="scene-bg" src="/characters/${imgSrc}" alt="" />
      <div class="scene-overlay"></div>
      <div class="r-content">${innerHtml}</div>
    </div>
  `);
  return section;
}

function renderRevealPage() {
  if (fetchError) {
    const scene = buildScene('reveal');
    sceneRoot.appendChild(scene);
    const content = scene.querySelector('#content');
    content.appendChild(el(`<div class="bubble">앗, 문제가 생겼어: ${fetchError}</div>`));
    scene.appendChild(buildCta('다시 시도', () => goTo('loading'), { raised: false }));
    return;
  }
  if (!resultData) return;

  const { saju, teaser } = resultData;
  const order = [['year','년주'],['month','월주'],['day','일주'],['time','시주']];
  const pillarsHtml = order.map(([key, label]) => {
    const p = saju.pillars[key];
    return `<div class="pillar"><div class="gz">${p.ganzhi}</div><div class="label">${label}</div><div class="sub">${p.stage}</div></div>`;
  }).join('');

  const page = el('<div class="reveal-page"></div>');

  page.appendChild(buildRevealSection('hyundam-reveal.webp', `
    <div class="impact">${state.name}의 <span class="accent">사주</span></div>
    <div class="pillars">${pillarsHtml}</div>
    <div class="bubble">${teaser.opening || '지금부터 하나씩 풀어볼게.'}</div>
    <div class="scroll-hint">▾ 스크롤해서 계속 보기</div>
  `));

  (teaser.sections || []).forEach((sec, i) => {
    const img = REVEAL_CYCLE[(i + 1) % REVEAL_CYCLE.length];
    const bodyHtml = i === 0 ? `<div class="r-body">${sec.body || ''}</div>` : teaseBody(sec.body || '');
    page.appendChild(buildRevealSection(img, `
      <div class="r-title">${sec.title || ''}</div>
      ${bodyHtml}
    `));
  });

  const lockedSection = buildRevealSection('hyundam-reveal.webp', `
    <div class="r-title">아직 안 끝났어</div>
    <div class="locked-card">
      <div class="locked-text">${teaser.locked_teaser || '더 자세한 이야기가 준비되어 있어...'}</div>
      <div class="lock-overlay"><div class="icon">🔒</div><div>이메일 남기면 전체 리포트를 볼 수 있어</div></div>
    </div>
    <div class="panel">
      <input type="email" id="emailInput" placeholder="이메일 주소" />
      <div class="note">지금은 데모 단계라 실제 이메일 발송은 아직 연결되어 있지 않아. 입력한 주소는 저장되지 않아.</div>
    </div>
    <button class="primary-btn" id="unlockBtn">전체 리포트 받기</button>
  `);
  page.appendChild(lockedSection);

  sceneRoot.appendChild(page);

  page.querySelectorAll('.tease-tag').forEach((tag) => {
    tag.onclick = () => lockedSection.scrollIntoView({ behavior: 'smooth' });
  });

  lockedSection.querySelector('#unlockBtn').onclick = () => {
    const email = lockedSection.querySelector('#emailInput').value.trim();
    if (!email) return;
    lockedSection.querySelector('.locked-text').style.filter = 'none';
    lockedSection.querySelector('.lock-overlay').classList.add('hidden');
    lockedSection.querySelector('.panel').innerHTML = '<div class="bubble">확인했어. (실제 발송 기능은 다음 단계에서 연결될 예정이야)</div>';
    page.querySelectorAll('.tease-blur').forEach((el) => { el.style.filter = 'none'; });
    page.querySelectorAll('.tease-tag').forEach((el) => { el.classList.add('hidden'); });
  };

  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add('in-view');
    });
  }, { threshold: 0.35 });
  page.querySelectorAll('.reveal-section').forEach((s) => io.observe(s));
}

render();
</script>
