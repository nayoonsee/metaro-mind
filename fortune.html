<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #05070f;
    color: #f2f4fb;
  }
  body { display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; position: relative; }

  .progress {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    height: 3px; background: rgba(255,255,255,0.15);
    max-width: 480px; margin: 0 auto;
  }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#5b6fd8,#dfe4fa); transition: width .3s; }

  .scene {
    position: relative; width: 100%; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden;
  }
  .scene-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 20%; z-index: 0;
    animation: kenburns 8s ease-out forwards;
  }
  @keyframes kenburns { from { transform: scale(1.06); } to { transform: scale(1); } }

  .back-btn {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(calc(-240px + 14px));
    z-index: 25; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(5,7,15,0.5); border: 1px solid rgba(255,255,255,0.2);
    color: #f2f4fb; display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
  }
  @media (max-width: 480px) { .back-btn { transform: none; left: 14px; } }
  .scene-overlay {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(5,7,15,0.1) 0%, rgba(5,7,15,0.15) 30%, rgba(5,7,15,0.72) 62%, rgba(5,7,15,0.97) 100%);
  }
  .scene-overlay.deep {
    background: linear-gradient(180deg, rgba(5,7,15,0.08) 0%, rgba(5,7,15,0.1) 22%, rgba(5,7,15,0.55) 45%, rgba(5,7,15,0.9) 66%, rgba(5,7,15,0.99) 100%);
  }
  .scene-content {
    position: relative; z-index: 2;
    padding: 24px 22px calc(108px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }

  .impact {
    font-family: 'Gugi', cursive;
    text-align: center; font-size: 30px; line-height: 1.4;
    letter-spacing: 0.5px;

  .prompt {
    font-family: 'Gugi', cursive;
    font-size: 22px; margin: 4px 0 4px;

  }

  .panel {
    background: rgba(10,13,26,0.6); backdrop-filter: blur(8px);

  }
  input[type=text], input[type=number], input[type=email] {
    width: 100%; padding: 13px 14px; border-radius: 12px;

  textarea {

  .row { display: flex; gap: 10px; }

  .choice-btn {

  .choice-btn:hover, .choice-btn.selected { background: rgba(91,111,216,0.35); border-color: #8c9cf0; }

  .toggle-btn {

  .cta-fixed {

  .cta-inner { width: 100%; max-width: 436px; display: flex; flex-direction: column; gap: 8px; }
  .primary-btn {

  .ghost-btn {

  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  .pillar .label { font-size: 10.5px; color: #a9b3e0; margin-top: 3px; }
  .pillar .sub { font-size: 10px; color: #cbb98a; margin-top: 1px; }

  .reveal-page { display: flex; flex-direction: column; }
  .reveal-section {
    position: relative; width: 100%; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden; padding: 90px 22px 60px;

  .reveal-section .r-content {
    position: relative; z-index: 2;

  .reveal-section.in-view .r-content { opacity: 1; transform: translateY(0); }
  .r-title {

  .tease-blur { filter: blur(5px); user-select: none; }
  .tease-tag {
    display: inline-block; margin-left: 6px; font-size: 11.5px; color: #e8caa0;

    white-space: nowrap; vertical-align: middle; cursor: pointer;
  }
  .scroll-hint {

    margin-top: 8px;

  @keyframes bounce { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(6px); opacity: 1; } }

  .locked-card { position: relative; border-radius: 16px; overflow: hidden; }
  .locked-text { filter: blur(5px); user-select: none; line-height: 1.6; font-size: 14px; padding: 16px; background: rgba(12,16,30,0.72); }
  .lock-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,7,15,0.55); gap: 6px; font-size: 13px; color: #cbd3f5; text-align: center; padding: 0 20px;

  .lock-overlay .icon { font-size: 24px; }
  .note { font-size: 11.5px; color: #97a0cf; text-align: center; line-height: 1.5; }

  /* ===== Opening sequence (scoped, does not affect other steps) ===== */
  .op-stage {
    position: relative; width: 100%; height: 100dvh; min-height: 100dvh;
    overflow: hidden; background: #000;
  }
  .op-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;

    transform: scale(1.05);

  .op-layer.op-show { opacity: 1; transform: scale(1); }
  .op-layer.op-under { transition: none; opacity: 1; transform: scale(1); z-index: 1; }
  .op-layer.op-top { z-index: 2; }

  .op-blackout {
    position: absolute; inset: 0; z-index: 40; background: #000;
    opacity: 1; transition: opacity .4s ease;
    pointer-events: none;
  }
  .op-blackout.op-hide { opacity: 0; }

  .op-fog {
    position: absolute; inset: -10% -20%; z-index: 5; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 30% at 20% 85%, rgba(150,170,220,0.16), transparent 70%),
      radial-gradient(ellipse 50% 25% at 80% 90%, rgba(150,170,220,0.12), transparent 70%);
    animation: opFogDrift 14s ease-in-out infinite alternate;
  }
  @keyframes opFogDrift { from { transform: translateX(-3%); } to { transform: translateX(3%); } }

  .op-doorlight {
    position: absolute; z-index: 3; pointer-events: none;

  .op-fog.op-fog-burst {
    animation: opFogBurst 1.4s ease-out 1;
  }
  @keyframes opFogBurst {
    0% { opacity: .4; transform: translateY(12%); }
    50% { opacity: 1; }
    100% { opacity: .55; transform: translateY(0); }

  .op-overlay {
    position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: linear-gradient(180deg, rgba(5,7,15,0.15) 0%, rgba(5,7,15,0.2) 40%, rgba(5,7,15,0.78) 72%, rgba(5,7,15,0.97) 100%);

  .op-content {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;

  .op-title {
    font-family: 'Song Myung', serif;

    color: #fbf6ec;

  }
  .op-title.op-show { filter: blur(0); opacity: 1; }
  .op-title .accent { color: #d7c48a; }
  .op-sub {
    font-family: 'Gowun Batang', serif;
    font-size: 17px; line-height: 1.6; color: #f1e9d8;

    filter: blur(6px); opacity: 0;
    transition: filter .6s ease, opacity .6s ease;
  }
  .op-sub.op-show { filter: blur(0); opacity: 1; }

  .op-shake { animation: opShake .18s ease; }
  @keyframes opShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

  .op-eye-glow-a, .op-eye-glow-b {

    pointer-events: none; opacity: 0; transition: opacity .7s ease;

  }
  .op-eye-glow-a { top: 38%; left: 27%; background: radial-gradient(circle, rgba(230,180,100,0.85), transparent 70%); }
  .op-eye-glow-b { top: 36%; left: 61%; background: radial-gradient(circle, rgba(150,190,230,0.85), transparent 70%); }
  .op-eye-glow-a.op-show, .op-eye-glow-b.op-show { opacity: 1; }
  .op-eye-glow-a.op-pulse, .op-eye-glow-b.op-pulse { animation: opEyePulse .4s ease; }
  @keyframes opEyePulse { 0% { filter: blur(10px) brightness(1); } 50% { filter: blur(10px) brightness(1.7); } 100% { filter: blur(10px) brightness(1); } }

  .op-bubble {
    font-family: 'Gowun Batang', serif;
    background: rgba(20, 12, 18, 0.78);
    border: 1px solid rgba(170, 40, 55, 0.55);
    border-radius: 16px;
    padding: 14px 20px;
    font-size: 16.5px; line-height: 1.6; color: #f4ece0;
    max-width: 90%;
    opacity: 0; transform: translateY(10px);

  }
  .op-bubble.op-show { opacity: 1; transform: translateY(0); }

  .op-gate-btn {
    font-family: 'Song Myung', serif;
    position: relative;
    width: 92%; max-width: 420px; height: 88px;
    display: flex; align-items: center; justify-content: center;

    font-size: clamp(18px, 5.6vw, 25px); white-space: nowrap; letter-spacing: 1px; color: #f3ddb8;
    background: linear-gradient(160deg, #861f29 0%, #65141c 45%, #3a080d 100%);
    border-radius: 6px;
    border: 1px solid #7a5a2c;
    box-shadow:
      inset 0 0 0 1px rgba(243,221,184,0.18),

      0 10px 28px rgba(0,0,0,0.55);

  .op-mute-btn.op-show { opacity: 1; }

<body>
<div class="app">
  <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="sceneRoot"></div>
</div>

<script>
const STEPS = ['intro','question','name','profile','birthdate','birthtime','relationship','job','loading','reveal'];
const INPUT_STEPS = new Set(['question','name','profile','birthdate','birthtime','relationship','job']);
const NO_BACK_STEPS = new Set(['intro','loading']);
let stepIndex = 0;
const state = {
  name: '', gender: '여성', calendar: 'solar',
  year: '', month: '', day: '', hour: '', minute: '',
  relationshipStatus: '', jobStatus: '', question: '',
};

const SCENE_IMAGE = {
  intro: 'hyundam-reveal.webp',
  name: 'hyundam-dialogue.webp',
  profile: 'hyundam-dialogue.webp',
  birthdate: 'hyundam-dialogue.webp',
  birthtime: 'hyundam-dialogue.webp',
  relationship: 'hyundam-focus.webp',
  job: 'hyundam-focus.webp',
  question: 'hyundam-focus.webp',
  loading: 'hyundam-focus.webp',
  reveal: 'hyundam-reveal.webp',
};

const sceneRoot = document.getElementById('sceneRoot');
const progressFill = document.getElementById('progressFill');

function setProgress() {
  const pct = Math.round((stepIndex / (STEPS.length - 2)) * 100);
  progressFill.style.width = Math.min(pct, 100) + '%';
}

function goTo(name) {
  stepIndex = STEPS.indexOf(name);
  setProgress();
  render();
}

function next() {
  stepIndex = Math.min(stepIndex + 1, STEPS.length - 1);
  setProgress();
  render();
}

function el(html) {
  const div = document.createElement('div');
  div.innerHTML = html.trim();
  return div.firstElementChild;
}

function buildScene(step) {
  const overlayClass = INPUT_STEPS.has(step) ? ' deep' : '';
  const scene = el(`
    <div class="scene">
      <img class="scene-bg" src="/characters/${SCENE_IMAGE[step]}" alt="" />
      <div class="scene-overlay${overlayClass}"></div>
      <div class="scene-content" id="content"></div>
    </div>
  `);
  if (!NO_BACK_STEPS.has(step) && stepIndex > 0) {
    const back = el('<button class="back-btn" aria-label="뒤로">‹</button>');
    back.onclick = () => {
      stepIndex = Math.max(0, stepIndex - 1);
      setProgress();
      render();
    };
    scene.appendChild(back);
  }
  return scene;
}

function buildCta(label, onClick, opts = {}) {
  const wrap = el(`
    <div class="cta-fixed">
      <div class="cta-inner">
        ${opts.ghostLabel ? `<button class="ghost-btn" id="ghostBtn">${opts.ghostLabel}</button>` : ''}
        <button class="primary-btn" id="ctaBtn">${label}</button>
      </div>
    </div>
  `);
  wrap.querySelector('#ctaBtn').onclick = onClick;
  if (opts.ghostLabel) wrap.querySelector('#ghostBtn').onclick = opts.onGhost;
  return wrap;
}

function render() {
  const step = STEPS[stepIndex];
  document.body.style.overflow = '';
  document.documentElement.style.overflow = '';
  sceneRoot.innerHTML = '';
  if (step === 'reveal') { renderRevealPage(); return; }
  if (step === 'intro') { renderOpeningSequence(); return; }
  const scene = buildScene(step);
  sceneRoot.appendChild(scene);
  const content = scene.querySelector('#content');
  const renderers = {
    question: renderQuestion,
    name: renderName,
    profile: renderProfile,
    birthdate: renderBirthdate,
    birthtime: renderBirthtime,
    relationship: renderRelationship,
    job: renderJob,
    loading: renderLoading,
  };
  renderers[step](content, scene);
}

function opPath(folder, file) {
  return '/characters/' + encodeURIComponent(folder) + '/' + encodeURIComponent(file);
}
const OP_IMG = {
  moon: opPath('현담_최종이미지_2부', '13_보름달_전신.webp'),
  eye: opPath('현담_최종이미지_1부', '03_오드아이_발광_클로즈업.webp'),
  invite: opPath('현담_최종이미지_2부', '12_손을_내미는_초대.webp'),
  gateClosed: opPath('현담_최종이미지_2부', '10_닫힌_신당입구.webp'),
  gateOpen: opPath('현담_최종이미지_2부', '11_열린_신당입구.webp'),
  leading: opPath('현담_최종이미지_1부', '01_신당으로_이끄는_전신.webp'),
};

const OP_AUDIO_SRC = {
  bell: '/audio/shrine-bell.mp3',
  wind: '/audio/shrine-wind.mp3',
  creak: '/audio/shrine-door-creak.mp3',
};
const OP_AUDIO_VOL = { bell: 0.32, creak: 0.42, wind: 0.12 };

const MUTE_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 9v6h4l5 5V4L8 9H4Z" fill="#f2f4fb"/><path class="op-mute-x" d="M16 9l5 6M21 9l-5 6" stroke="#f2f4fb" stroke-width="1.6" stroke-linecap="round"/><path class="op-mute-wave" d="M16.5 8.5c1.8 1.8 1.8 5.2 0 7" stroke="#f2f4fb" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>';

function renderOpeningSequence() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';

  const stage = el(`
    <div class="op-stage">
      <img class="op-layer" id="opImg" src="${OP_IMG.eye}" alt="" />
      <div class="op-fog" id="opFog"></div>
      <div class="op-eye-glow-a" id="opEyeA"></div>
      <div class="op-eye-glow-b" id="opEyeB"></div>
      <div class="op-doorlight" id="opDoorlight"></div>
      <div class="op-overlay"></div>
      <div class="op-content" id="opContent"></div>
      <div class="op-blackout" id="opBlackout"></div>
      <button class="op-mute-btn" id="opMuteBtn" aria-label="음소거">${MUTE_SVG}</button>
    </div>
  `);
  sceneRoot.appendChild(stage);

  const opImg = stage.querySelector('#opImg');
  const opContent = stage.querySelector('#opContent');
  const opBlackout = stage.querySelector('#opBlackout');
  const eyeA = stage.querySelector('#opEyeA');
  const eyeB = stage.querySelector('#opEyeB');
  const opFog = stage.querySelector('#opFog');
  const opDoorlight = stage.querySelector('#opDoorlight');
  const muteBtn = stage.querySelector('#opMuteBtn');

  // ---- Audio (lazily created; missing files fail silently) ----
  let muted = false;
  const sfx = {
    bell: new Audio(OP_AUDIO_SRC.bell),
    wind: new Audio(OP_AUDIO_SRC.wind),
    creak: new Audio(OP_AUDIO_SRC.creak),
  };
  sfx.bell.volume = OP_AUDIO_VOL.bell;
  sfx.creak.volume = OP_AUDIO_VOL.creak;
  sfx.wind.volume = OP_AUDIO_VOL.wind;
  sfx.wind.loop = true;
  Object.values(sfx).forEach((a) => { a.preload = 'auto'; a.addEventListener('error', () => {}); });

  function unlockAudio() {
    // Mobile browsers require each element to be touched inside a user gesture once.
    Object.values(sfx).forEach((a) => {
      try {
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
        a.pause();
        a.currentTime = 0;
      } catch (e) {}
    });
  }
  function playSfx(name) {
    if (muted) return;
    try {
      const a = sfx[name];
      a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function fadeOutWind(ms) {
    try {
      const a = sfx.wind;
      const startVol = a.volume;
      const steps = 10;
      const stepMs = ms / steps;
      let i = 0;
      const iv = setInterval(() => {
        i++;
        a.volume = Math.max(0, startVol * (1 - i / steps));
        if (i >= steps) { clearInterval(iv); a.pause(); a.currentTime = 0; }
      }, stepMs);
    } catch (e) {}
  }
  muteBtn.onclick = () => {
    muted = !muted;
    Object.values(sfx).forEach((a) => { a.muted = muted; });
    muteBtn.classList.toggle('op-muted', muted);
  };

  const timers = [];
  const after = (ms, fn) => { timers.push(setTimeout(fn, ms)); };
  function cleanup() {
    timers.forEach(clearTimeout);
    stage.removeEventListener('click', skipLeading);
  }
  function proceed() {
    cleanup();
    Object.values(sfx).forEach((a) => { try { a.pause(); } catch (e) {} });
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
    next();
  }

  const OP_EASE = 'cubic-bezier(0.33, 0, 0.2, 1)'; // slow start, slow end — no abrupt snap

  // Sequential fade (image dips through transparent) — used for quick cuts.
  function crossfadeTo(newSrc, opts = {}) {
    const outMs = opts.outMs != null ? opts.outMs : (opts.fadeMs || 500);
    const inMs = opts.inMs != null ? opts.inMs : (opts.fadeMs || 500);
    opImg.style.transition = `opacity ${outMs}ms ${OP_EASE}`;
    opImg.style.opacity = '0';
    after(outMs, () => {
      opImg.src = newSrc;
      const zoomMs = opts.zoomMs || inMs;
      opImg.style.transition = `opacity ${inMs}ms ${OP_EASE}, transform ${zoomMs}ms ${OP_EASE}`;
      requestAnimationFrame(() => {
        opImg.style.opacity = '1';
        if (opts.zoomTo) opImg.style.transform = `scale(${opts.zoomTo})`;
      });
    });
  }

  // True simultaneous crossfade via a temporary overlay layer (no dark dip).
  function trueCrossfadeTo(newSrc, ms, opts = {}) {
    const overlay = document.createElement('img');
    overlay.className = 'op-layer op-top';
    overlay.alt = '';
    overlay.style.opacity = '0';
    overlay.style.transform = 'scale(1)';
    const zoomMs = opts.zoomMs || ms;
    overlay.style.transition = `opacity ${ms}ms ${OP_EASE}, transform ${zoomMs}ms ${OP_EASE}`;
    overlay.src = newSrc;
    stage.insertBefore(overlay, opFog);
    requestAnimationFrame(() => {
      overlay.style.opacity = '1';
      if (opts.zoomTo) overlay.style.transform = `scale(${opts.zoomTo})`;
    });
    after(ms, () => {
      opImg.style.transition = 'none';
      opImg.src = newSrc;
      opImg.style.opacity = '1';
      if (opts.zoomTo) opImg.style.transform = `scale(${opts.zoomTo})`;
      overlay.remove();
    });
  }

  function skipLeading() { proceed(); }

  if (reduced) {
    // Reduced motion: minimal, fast, no shake/zoom/looping fog/audio-heavy cues
    opFog.style.display = 'none';
    opImg.src = OP_IMG.moon;
    opImg.classList.add('op-show');
    opContent.innerHTML = `
      <div class="op-title op-show">네 <span class="accent">운명</span>, 내가<br/>가감 없이 읽어줄게</div>
      <div class="op-sub op-show">현담이야. 여기까지 왔다는 건 뭔가 걸리는 게 있다는 거겠지. 숨기지 말고 다 말해봐.</div>
    `;
    opBlackout.classList.add('op-hide');
    after(900, () => {
      opContent.innerHTML = '';
      opImg.src = OP_IMG.invite;
      opContent.innerHTML = `
        <div class="op-bubble op-show">왔군. 네 운명이 문 앞에서 기다리고 있어.</div>
      `;
      const btn = el(`<button class="op-gate-btn op-show">현담의 신당으로 들어가기</button>`);
      btn.onclick = () => {
        btn.disabled = true;
        unlockAudio();
        playSfx('bell');
        muteBtn.classList.add('op-show');
        opBlackout.classList.remove('op-hide');
        after(200, () => {
          opImg.src = OP_IMG.leading;
          opContent.innerHTML = `<div class="op-bubble op-show">따라와. 네 사주는 안쪽에서 보지.</div>`;
          opBlackout.classList.add('op-hide');
          stage.addEventListener('click', skipLeading);
          after(800, proceed);
        });
      };
      opContent.appendChild(btn);
    });
    return;
  }

  // ================= Phase 1: eye impact FIRST (03_오드아이) =================
  after(300, () => opBlackout.classList.add('op-hide'));
  after(350, () => opImg.classList.add('op-show')); // 1.4s opacity fade / 2.6s slow scale (opImg already src=eye)
  after(1250, () => { // glow builds gradually as image settles in
    eyeA.classList.add('op-show');
    eyeB.classList.add('op-show');
    after(700, () => { // then intensifies once
      eyeA.classList.add('op-pulse');
      eyeB.classList.add('op-pulse');
    });
  });

  // ================= Phase 2: moonlit reveal (13_보름달_전신, title + subcopy) =================
  after(4200, () => {
    eyeA.classList.remove('op-show', 'op-pulse');
    eyeB.classList.remove('op-show', 'op-pulse');
    crossfadeTo(OP_IMG.moon, { fadeMs: 900 });
    after(500, () => {
      const title = el(`<div class="op-title">네 <span class="accent">운명</span>, 내가<br/>가감 없이 읽어줄게</div>`);
      opContent.appendChild(title);
      requestAnimationFrame(() => title.classList.add('op-show'));
    });
    after(900, () => {
      const sub = el(`<div class="op-sub">현담이야. 여기까지 왔다는 건 뭔가 걸리는 게 있다는 거겠지. 숨기지 말고 다 말해봐.</div>`);
      opContent.appendChild(sub);
      requestAnimationFrame(() => sub.classList.add('op-show'));
    });
  });

  // ================= Phase 3: invitation (12_손을_내미는_초대, waits for tap) =================
  after(8400, () => {
    eyeA.classList.remove('op-show', 'op-pulse');
    eyeB.classList.remove('op-show', 'op-pulse');
    crossfadeTo(OP_IMG.invite, { outMs: 400, inMs: 1200 });
    after(400, () => {
      const bubble = el(`<div class="op-bubble">왔군. 네 운명이 문 앞에서 기다리고 있어.</div>`);
      opContent.appendChild(bubble);
      requestAnimationFrame(() => bubble.classList.add('op-show'));
      after(500, () => {
        const btn = el(`<button class="op-gate-btn"><span class="op-sheen"></span><span class="op-corner op-corner-l">${MOON_SVG}</span>현담의 신당으로 들어가기<span class="op-corner op-corner-r">${MOON_SVG}</span></button>`);
        opContent.appendChild(btn);
        requestAnimationFrame(() => btn.classList.add('op-show'));
        btn.onclick = () => {
          btn.disabled = true;
          btn.style.pointerEvents = 'none';
          btn.classList.add('op-pressed');
          unlockAudio();
          playSfx('bell');
          muteBtn.classList.add('op-show');
          after(150, () => enterShrine());
        };
      });
    });
  });

  function enterShrine() {
    // Flat, non-overlapping schedule (all offsets relative to this call)
    opContent.innerHTML = '';
    opBlackout.style.transitionDuration = '0.45s';
    opBlackout.classList.remove('op-hide'); // t=0: screen darkens over 0.45s

    after(450, () => { // black is now opaque: swap to closed gate unseen
      opImg.style.transition = 'none';
      opImg.src = OP_IMG.gateClosed;
      opImg.style.opacity = '0';
      opImg.style.transform = 'scale(1)';
      requestAnimationFrame(() => {
        opImg.style.transition = `opacity 1300ms ${OP_EASE}, transform 2600ms ${OP_EASE}`;
        opImg.style.opacity = '1';
        opImg.style.transform = 'scale(1.03)'; // very slow, barely-there zoom
      });
      opBlackout.style.transitionDuration = '0.35s';
      opBlackout.classList.add('op-hide');
      playSfx('wind');
    });

    // closed door fully visible at 450+1300=1750; hold 1.2s
    // light seeps through the door crack BEFORE it opens (no abrupt cut)
    after(2950, () => {
      opDoorlight.classList.add('op-show');
    });
    after(3250, () => {
      playSfx('creak');
    });

    // 0.4s after creak starts, begin the slow crossfade to the open gate
    after(3650, () => {
      opDoorlight.classList.remove('op-show');
      trueCrossfadeTo(OP_IMG.gateOpen, 2600, { zoomTo: 1.07, zoomMs: 3800 });
    });

    // open gate fully visible at 3650+2600=6250; hold 1.2s -> lead inward at 7450
    // leading scene keeps drifting inward the whole time it's held (feels like walking in together)
    after(7450, () => {
      trueCrossfadeTo(OP_IMG.leading, 1400, { zoomTo: 1.05, zoomMs: 3400 });
    });

    // leading scene fully visible at 7450+1400=8850; hold 2s (auto) / tap to skip
    after(8850, () => {
      const bubble = el(`<div class="op-bubble">따라와. 네 사주는 안쪽에서 보지.</div>`);
      opContent.appendChild(bubble);
      requestAnimationFrame(() => bubble.classList.add('op-show'));
      stage.addEventListener('click', skipLeading);
      fadeOutWind(1000);
      after(2000, proceed);
    });
  }
}

const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 3.5C11 3.5 7 7.8 7 12s4 8.5 9 8.5c-6.5-1-9.5-6-9.5-8.5S9.5 4.5 16 3.5Z" fill="#e8caa0" opacity="0.9"/></svg>';

let resultData = null;
let fetchError = null;

async function startFetch() {
  goTo('loading');
  try {
    const payload = {
      name: state.name, gender: state.gender, calendar: state.calendar,
      year: Number(state.year), month: Number(state.month), day: Number(state.day),
      relationshipStatus: state.relationshipStatus, jobStatus: state.jobStatus, question: state.question,
    };
    if (state.hour !== '') payload.hour = Number(state.hour);
    if (state.minute !== '') payload.minute = Number(state.minute);

    const res = await fetch('/api/teaser', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '분석에 실패했어.');
    resultData = data;
    fetchError = null;
  } catch (err) {
    fetchError = err.message;
    resultData = null;
  }
  goTo('reveal');
}

const REVEAL_CYCLE = ['hyundam-reveal.webp', 'hyundam-avatar.webp', 'hyundam-dialogue.webp', 'hyundam-focus.webp'];

function teaseBody(body) {
  const match = body.match(/^(.{8,60}?[.!?…])\s*(.*)$/s);
  if (!match) return `<div class="r-body">${body}</div>`;
  const [, visible, rest] = match;
  if (!rest) return `<div class="r-body">${visible}</div>`;
  return `<div class="r-body">${visible} <span class="tease-blur">${rest}</span><span class="tease-tag">🔒 이어보기</span></div>`;
}

function buildRevealSection(imgSrc, innerHtml, extraClass) {
  const section = el(`
    <div class="reveal-section${extraClass ? ' ' + extraClass : ''}">
      <img class="scene-bg" src="/characters/${imgSrc}" alt="" />
      <div class="scene-overlay"></div>
      <div class="r-content">${innerHtml}</div>
    </div>
  `);
  return section;
}

function renderRevealPage() {
  if (fetchError) {
    const scene = buildScene('reveal');
    sceneRoot.appendChild(scene);
    const content = scene.querySelector('#content');
    content.appendChild(el(`<div class="bubble">앗, 문제가 생겼어: ${fetchError}</div>`));
    scene.appendChild(buildCta('다시 시도', startFetch));
    return;
  }
  if (!resultData) return;

  const { saju, teaser } = resultData;
  const order = [['year','년주'],['month','월주'],['day','일주'],['time','시주']];
  const pillarsHtml = order.map(([key, label]) => {
    const p = saju.pillars[key];
    return `<div class="pillar"><div class="gz">${p.ganzhi}</div><div class="label">${label}</div><div class="sub">${p.stage}</div></div>`;
  }).join('');

  const page = el('<div class="reveal-page"></div>');

  page.appendChild(buildRevealSection('hyundam-reveal.webp', `
    <div class="impact">${state.name}의 <span class="accent">사주</span></div>
    <div class="pillars">${pillarsHtml}</div>
    <div class="bubble">${teaser.opening || '지금부터 하나씩 풀어볼게.'}</div>
    <div class="scroll-hint">▾ 스크롤해서 계속 보기</div>
  `));

  (teaser.sections || []).forEach((sec, i) => {
    const img = REVEAL_CYCLE[(i + 1) % REVEAL_CYCLE.length];
    const bodyHtml = i === 0 ? `<div class="r-body">${sec.body || ''}</div>` : teaseBody(sec.body || '');
    page.appendChild(buildRevealSection(img, `
      <div class="r-title">${sec.title || ''}</div>
      ${bodyHtml}
    `));
  });

  const lockedSection = buildRevealSection('hyundam-reveal.webp', `
    <div class="r-title">아직 안 끝났어</div>
    <div class="locked-card">
      <div class="locked-text">${teaser.locked_teaser || '더 자세한 이야기가 준비되어 있어...'}</div>
      <div class="lock-overlay"><div class="icon">🔒</div><div>이메일 남기면 전체 리포트를 볼 수 있어</div></div>
    </div>
    <div class="panel">
      <input type="email" id="emailInput" placeholder="이메일 주소" />
      <div class="note">지금은 데모 단계라 실제 이메일 발송은 아직 연결되어 있지 않아. 입력한 주소는 저장되지 않아.</div>
    </div>
    <button class="primary-btn" id="unlockBtn">전체 리포트 받기</button>
  `);
  page.appendChild(lockedSection);

  sceneRoot.appendChild(page);

  page.querySelectorAll('.tease-tag').forEach((tag) => {
    tag.onclick = () => lockedSection.scrollIntoView({ behavior: 'smooth' });
  });

  lockedSection.querySelector('#unlockBtn').onclick = () => {
    const email = lockedSection.querySelector('#emailInput').value.trim();
    if (!email) return;
    lockedSection.querySelector('.locked-text').style.filter = 'none';
    lockedSection.querySelector('.lock-overlay').classList.add('hidden');
    lockedSection.querySelector('.panel').innerHTML = '<div class="bubble">확인했어. (실제 발송 기능은 다음 단계에서 연결될 예정이야)</div>';
    page.querySelectorAll('.tease-blur').forEach((el) => { el.style.filter = 'none'; });
    page.querySelectorAll('.tease-tag').forEach((el) => { el.classList.add('hidden'); });
  };

  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add('in-view');
    });
  }, { threshold: 0.35 });
  page.querySelectorAll('.reveal-section').forEach((s) => io.observe(s));
}

render();
</script>
</body>
</html>
