<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>메타로마인드 - 현담의 사주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gugi&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #05070f;
    color: #f2f4fb;
  }
  body { display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; position: relative; }

  .progress {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    height: 3px; background: rgba(255,255,255,0.15);
    max-width: 480px; margin: 0 auto;
  }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#5b6fd8,#dfe4fa); transition: width .3s; }

  .scene {
    position: relative; width: 100%; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden;
  }
  .scene-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 20%; z-index: 0;
    animation: kenburns 8s ease-out forwards;
  }
  @keyframes kenburns { from { transform: scale(1.06); } to { transform: scale(1); } }

  .back-btn {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(calc(-240px + 14px));
    z-index: 25; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(5,7,15,0.5); border: 1px solid rgba(255,255,255,0.2);
    color: #f2f4fb; display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer;
  }
  @media (max-width: 480px) { .back-btn { transform: none; left: 14px; } }
  .scene-overlay {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(5,7,15,0.1) 0%, rgba(5,7,15,0.15) 30%, rgba(5,7,15,0.72) 62%, rgba(5,7,15,0.97) 100%);
  }
  .scene-overlay.deep {
    background: linear-gradient(180deg, rgba(5,7,15,0.08) 0%, rgba(5,7,15,0.1) 22%, rgba(5,7,15,0.55) 45%, rgba(5,7,15,0.9) 66%, rgba(5,7,15,0.99) 100%);
  }
  .scene-content {
    position: relative; z-index: 2;
    padding: 24px 22px calc(108px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }

  .impact {
    font-family: 'Gugi', cursive;
    text-align: center; font-size: 30px; line-height: 1.4;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.8);
    margin: 8px 0 4px;
    animation: fadeUp .5s ease both;
  }
  .impact .accent { color: #a9b6f5; }

  .bubble {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    background: rgba(12,16,30,0.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px 20px 20px 4px;
    padding: 14px 18px; max-width: 88%;
    font-size: 16.5px; line-height: 1.6;
    animation: fadeUp .45s ease both;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .prompt {
    font-family: 'Gugi', cursive;
    font-size: 22px; margin: 4px 0 4px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }

  .panel {
    background: rgba(10,13,26,0.6); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 18px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  input[type=text], input[type=number], input[type=email] {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.35); color: #fff; font-size: 16px;
  }
  textarea {
    width: 100%; padding: 13px 14px; border-radius: 12px; min-height: 84px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.35); color: #fff; font-size: 15px; font-family: inherit; resize: vertical;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .choice-btn {
    width: 100%; text-align: left; padding: 13px 16px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.35); color: #f2f4fb; font-size: 15px;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  .choice-btn:hover, .choice-btn.selected { background: rgba(91,111,216,0.35); border-color: #8c9cf0; }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; padding: 10px; border-radius: 10px; text-align: center; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.35); font-size: 14px;
  }
  .toggle-btn.active { background: rgba(91,111,216,0.4); border-color: #8c9cf0; }

  .cta-fixed {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; justify-content: center;
    padding: 14px 22px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, rgba(5,7,15,0.85) 35%, #05070f 85%);
  }
  .cta-inner { width: 100%; max-width: 436px; display: flex; flex-direction: column; gap: 8px; }
  .primary-btn {
    font-family: 'Gugi', cursive;
    position: relative; width: 100%; padding: 15px; cursor: pointer;
    border: 1px solid #a9873f; border-radius: 4px;
    background: linear-gradient(180deg,#1c1408,#0d0a05);
    color: #e8caa0; font-size: 15px;
    letter-spacing: 1px;
    box-shadow: 0 0 0 1px rgba(169,135,63,0.25) inset, 0 6px 20px rgba(0,0,0,0.5);
    text-shadow: 0 1px 6px rgba(232,202,160,0.3);
  }
  .primary-btn::before, .primary-btn::after {
    content: ''; position: absolute; top: 4px; bottom: 4px; width: 1px;
    background: rgba(169,135,63,0.5);
  }
  .primary-btn::before { left: 8px; }
  .primary-btn::after { right: 8px; }
  .primary-btn:disabled { opacity: .5; cursor: not-allowed; }
  .ghost-btn {
    width: 100%; padding: 11px; border-radius: 12px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.25); color: #d6dafc; font-size: 13.5px; cursor: pointer;
  }
  .error { color: #ff9b9b; font-size: 13px; text-align: center; }
  .hidden { display: none !important; }

  .spinner-scene { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-bottom: 40px; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2); border-top-color: #a9b6f5;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pillar { text-align: center; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 10px 4px; border: 1px solid rgba(255,255,255,0.14); }
  .pillar .gz { font-size: 20px; font-weight: 700; }
  .pillar .label { font-size: 10.5px; color: #a9b3e0; margin-top: 3px; }
  .pillar .sub { font-size: 10px; color: #cbb98a; margin-top: 1px; }

  .reveal-page { display: flex; flex-direction: column; }
  .reveal-section {
    position: relative; width: 100%; min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden; padding: 90px 22px 60px;
  }
  .reveal-section .r-content {
    position: relative; z-index: 2;
    opacity: 0; transform: translateY(24px);
    transition: opacity .7s ease, transform .7s ease;
    display: flex; flex-direction: column; gap: 12px;
  }
  .reveal-section.in-view .r-content { opacity: 1; transform: translateY(0); }
  .r-title {
    font-family: 'Gugi', cursive;
    font-size: 24px; text-shadow: 0 2px 14px rgba(0,0,0,0.8);
  }
  .r-body {
    font-size: 15.5px; line-height: 1.7; text-shadow: 0 1px 10px rgba(0,0,0,0.7);
  }
  .tease-blur { filter: blur(5px); user-select: none; }
  .tease-tag {
    display: inline-block; margin-left: 6px; font-size: 11.5px; color: #e8caa0;
    border: 1px solid rgba(169,135,63,0.5); border-radius: 999px; padding: 2px 8px;
    white-space: nowrap; vertical-align: middle; cursor: pointer;
  }
  .scroll-hint {
    text-align: center; font-size: 12.5px; color: #cbd3f5;
    margin-top: 8px;
    animation: bounce 1.6s ease-in-out infinite;
  }
  @keyframes bounce { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(6px); opacity: 1; } }

  .locked-card { position: relative; border-radius: 16px; overflow: hidden; }
  .locked-text { filter: blur(5px); user-select: none; line-height: 1.6; font-size: 14px; padding: 16px; background: rgba(12,16,30,0.72); }
  .lock-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,7,15,0.55); gap: 6px; font-size: 13px; color: #cbd3f5; text-align: center; padding: 0 20px;
  }
  .lock-overlay .icon { font-size: 24px; }
  .note { font-size: 11.5px; color: #97a0cf; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="app">
  <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="sceneRoot"></div>
</div>

<script>
const STEPS = ['intro','question','name','profile','birthdate','birthtime','relationship','job','loading','reveal'];
const INPUT_STEPS = new Set(['question','name','profile','birthdate','birthtime','relationship','job']);
const NO_BACK_STEPS = new Set(['intro','loading']);
let stepIndex = 0;
const state = {
  name: '', gender: '여성', calendar: 'solar',
  year: '', month: '', day: '', hour: '', minute: '',
  relationshipStatus: '', jobStatus: '', question: '',
};

const SCENE_IMAGE = {
  intro: 'hyundam-reveal.webp',
  name: 'hyundam-dialogue.webp',
  profile: 'hyundam-dialogue.webp',
  birthdate: 'hyundam-dialogue.webp',
  birthtime: 'hyundam-dialogue.webp',
  relationship: 'hyundam-focus.webp',
  job: 'hyundam-focus.webp',
  question: 'hyundam-focus.webp',
  loading: 'hyundam-focus.webp',
  reveal: 'hyundam-reveal.webp',
};

const sceneRoot = document.getElementById('sceneRoot');
const progressFill = document.getElementById('progressFill');

function setProgress() {
  const pct = Math.round((stepIndex / (STEPS.length - 2)) * 100);
  progressFill.style.width = Math.min(pct, 100) + '%';
}

function goTo(name) {
  stepIndex = STEPS.indexOf(name);
  setProgress();
  render();
}

function next() {
  stepIndex = Math.min(stepIndex + 1, STEPS.length - 1);
  setProgress();
  render();
}

function el(html) {
  const div = document.createElement('div');
  div.innerHTML = html.trim();
  return div.firstElementChild;
}

function buildScene(step) {
  const overlayClass = INPUT_STEPS.has(step) ? ' deep' : '';
  const scene = el(`
    <div class="scene">
      <img class="scene-bg" src="/characters/${SCENE_IMAGE[step]}" alt="" />
      <div class="scene-overlay${overlayClass}"></div>
      <div class="scene-content" id="content"></div>
    </div>
  `);
  if (!NO_BACK_STEPS.has(step) && stepIndex > 0) {
    const back = el('<button class="back-btn" aria-label="뒤로">‹</button>');
    back.onclick = () => {
      stepIndex = Math.max(0, stepIndex - 1);
      setProgress();
      render();
    };
    scene.appendChild(back);
  }
  return scene;
}

function buildCta(label, onClick, opts = {}) {
  const wrap = el(`
    <div class="cta-fixed">
      <div class="cta-inner">
        ${opts.ghostLabel ? `<button class="ghost-btn" id="ghostBtn">${opts.ghostLabel}</button>` : ''}
        <button class="primary-btn" id="ctaBtn">${label}</button>
      </div>
    </div>
  `);
  wrap.querySelector('#ctaBtn').onclick = onClick;
  if (opts.ghostLabel) wrap.querySelector('#ghostBtn').onclick = opts.onGhost;
  return wrap;
}

function render() {
  const step = STEPS[stepIndex];
  sceneRoot.innerHTML = '';
  if (step === 'reveal') { renderRevealPage(); return; }
  const scene = buildScene(step);
  sceneRoot.appendChild(scene);
  const content = scene.querySelector('#content');
  const renderers = {
    intro: renderIntro,
    question: renderQuestion,
    name: renderName,
    profile: renderProfile,
    birthdate: renderBirthdate,
    birthtime: renderBirthtime,
    relationship: renderRelationship,
    job: renderJob,
    loading: renderLoading,
  };
  renderers[step](content, scene);
}

function renderIntro(content, scene) {
  content.appendChild(el('<div class="impact">네 <span class="accent">운명</span>, 내가<br/>가감 없이 읽어줄게</div>'));
  content.appendChild(el('<div class="bubble">현담이야. 여기까지 왔다는 건 뭔가 걸리는 게 있다는 거겠지. 숨기지 말고 다 말해봐.</div>'));
  scene.appendChild(buildCta('시작하기', next));
}

function renderQuestion(content, scene) {
  content.appendChild(el('<div class="bubble">그래서, 뭐가 그렇게 물어보고 싶어서 여기까지 왔어? 하나만 말해봐, 거기서부터 풀어줄 테니까.</div>'));
  const panel = el('<div class="panel"></div>');
  const ta = el('<textarea placeholder="예: 올해 이직해도 될까?"></textarea>');
  panel.appendChild(ta);
  content.appendChild(panel);
  scene.appendChild(buildCta('다음', () => { state.question = ta.value.trim(); next(); }, {
    ghostLabel: '딱히 없어, 그냥 봐줘',
    onGhost: () => { state.question = ''; next(); },
  }));
}

function renderName(content, scene) {
  content.appendChild(el('<div class="bubble">이름부터. 불러줘야 제대로 보이지.</div>'));
  const panel = el('<div class="panel"></div>');
  const input = el('<input type="text" placeholder="이름 또는 별명" />');
  input.value = state.name;
  panel.appendChild(input);
  content.appendChild(panel);
  scene.appendChild(buildCta('확인', () => {
    state.name = input.value.trim() || '손님';
    next();
  }));
  setTimeout(() => input.focus(), 50);
}

function renderProfile(content, scene) {
  content.appendChild(el(`<div class="bubble">${state.name}이라... 성별이랑, 태어난 걸 양력으로 셀지 음력으로 셀지 알려줘.</div>`));
  const panel = el('<div class="panel"></div>');
  const genderRow = el('<div class="toggle-row"></div>');
  ['여성', '남성'].forEach((g) => {
    const b = el(`<div class="toggle-btn ${state.gender === g ? 'active' : ''}">${g}</div>`);
    b.onclick = () => { state.gender = g; render(); };
    genderRow.appendChild(b);
  });
  const calRow = el('<div class="toggle-row"></div>');
  [['solar','양력'], ['lunar','음력']].forEach(([v, label]) => {
    const b = el(`<div class="toggle-btn ${state.calendar === v ? 'active' : ''}">${label}</div>`);
    b.onclick = () => { state.calendar = v; render(); };
    calRow.appendChild(b);
  });
  panel.appendChild(genderRow);
  panel.appendChild(calRow);
  content.appendChild(panel);
  scene.appendChild(buildCta('다음', next));
}

function renderBirthdate(content, scene) {
  content.appendChild(el('<div class="bubble">태어난 날. 정확하게, 하나도 빼놓지 말고.</div>'));
  const panel = el('<div class="panel"></div>');
  const row = el('<div class="row"></div>');
  const y = el('<input type="number" placeholder="년(YYYY)" min="1900" max="2100" />');
  const mo = el('<input type="number" placeholder="월" min="1" max="12" />');
  const d = el('<input type="number" placeholder="일" min="1" max="31" />');
  y.value = state.year; mo.value = state.month; d.value = state.day;
  row.appendChild(y); row.appendChild(mo); row.appendChild(d);
  panel.appendChild(row);
  content.appendChild(panel);
  const errorBox = el('<div class="error hidden"></div>');
  content.appendChild(errorBox);
  scene.appendChild(buildCta('다음', () => {
    if (!y.value || !mo.value || !d.value) {
      errorBox.textContent = '년/월/일을 모두 입력해줘.';
      errorBox.classList.remove('hidden');
      return;
    }
    state.year = y.value; state.month = mo.value; state.day = d.value;
    next();
  }));
}

function renderBirthtime(content, scene) {
  content.appendChild(el('<div class="bubble">시(時)까지 알아야 진짜가 보여. 몇 시에 태어났어?</div>'));
  const panel = el('<div class="panel"></div>');
  const row = el('<div class="row"></div>');
  const h = el('<input type="number" placeholder="시(0-23)" min="0" max="23" />');
  const m = el('<input type="number" placeholder="분" min="0" max="59" />');
  h.value = state.hour; m.value = state.minute;
  row.appendChild(h); row.appendChild(m);
  panel.appendChild(row);
  content.appendChild(panel);
  scene.appendChild(buildCta('다음', () => {
    state.hour = h.value; state.minute = m.value;
    next();
  }, {
    ghostLabel: '시간 몰라',
    onGhost: () => { state.hour = ''; state.minute = ''; next(); },
  }));
}

function renderChoiceStep(content, scene, prompt, options, stateKey, onSelect) {
  content.appendChild(el(`<div class="bubble">${prompt}</div>`));
  const panel = el('<div class="panel"></div>');
  options.forEach((opt) => {
    const b = el(`<div class="choice-btn ${state[stateKey] === opt ? 'selected' : ''}">${opt}</div>`);
    b.onclick = () => { state[stateKey] = opt; onSelect(); };
    panel.appendChild(b);
  });
  content.appendChild(panel);
}

function renderRelationship(content, scene) {
  renderChoiceStep(content, scene, '연애는. 지금 누구랑 얽혀있어?', ['솔로예요', '마음 가는 사람 있어요', '연애 중이에요', '헤어진 지 얼마 안 됐어요', '기혼이에요'], 'relationshipStatus', next);
}

function renderJob(content, scene) {
  renderChoiceStep(content, scene, '먹고사는 건 어떻게 하고 있어? 하나로 안 끝나면 제일 크게 걸리는 걸로.', ['학생이에요', '일 구하고 있어요', '직장 다녀요', '직장 다니면서 다른 일도 병행해요', '사업/프리랜서예요', '무직이에요'], 'jobStatus', startFetch);
}

function renderLoading(content) {
  content.appendChild(el(`
    <div class="spinner-scene">
      <div class="spinner"></div>
      <div class="bubble">가만있어봐. 지금 네 팔자 짚어보고 있으니까.</div>
    </div>
  `));
}

let resultData = null;
let fetchError = null;

async function startFetch() {
  goTo('loading');
  try {
    const payload = {
      name: state.name, gender: state.gender, calendar: state.calendar,
      year: Number(state.year), month: Number(state.month), day: Number(state.day),
      relationshipStatus: state.relationshipStatus, jobStatus: state.jobStatus, question: state.question,
    };
    if (state.hour !== '') payload.hour = Number(state.hour);
    if (state.minute !== '') payload.minute = Number(state.minute);

    const res = await fetch('/api/teaser', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '분석에 실패했어.');
    resultData = data;
    fetchError = null;
  } catch (err) {
    fetchError = err.message;
    resultData = null;
  }
  goTo('reveal');
}

const REVEAL_CYCLE = ['hyundam-reveal.webp', 'hyundam-avatar.webp', 'hyundam-dialogue.webp', 'hyundam-focus.webp'];

function teaseBody(body) {
  const match = body.match(/^(.{8,60}?[.!?…])\s*(.*)$/s);
  if (!match) return `<div class="r-body">${body}</div>`;
  const [, visible, rest] = match;
  if (!rest) return `<div class="r-body">${visible}</div>`;
  return `<div class="r-body">${visible} <span class="tease-blur">${rest}</span><span class="tease-tag">🔒 이어보기</span></div>`;
}

function buildRevealSection(imgSrc, innerHtml, extraClass) {
  const section = el(`
    <div class="reveal-section${extraClass ? ' ' + extraClass : ''}">
      <img class="scene-bg" src="/characters/${imgSrc}" alt="" />
      <div class="scene-overlay"></div>
      <div class="r-content">${innerHtml}</div>
    </div>
  `);
  return section;
}

function renderRevealPage() {
  if (fetchError) {
    const scene = buildScene('reveal');
    sceneRoot.appendChild(scene);
    const content = scene.querySelector('#content');
    content.appendChild(el(`<div class="bubble">앗, 문제가 생겼어: ${fetchError}</div>`));
    scene.appendChild(buildCta('다시 시도', startFetch));
    return;
  }
  if (!resultData) return;

  const { saju, teaser } = resultData;
  const order = [['year','년주'],['month','월주'],['day','일주'],['time','시주']];
  const pillarsHtml = order.map(([key, label]) => {
    const p = saju.pillars[key];
    return `<div class="pillar"><div class="gz">${p.ganzhi}</div><div class="label">${label}</div><div class="sub">${p.stage}</div></div>`;
  }).join('');

  const page = el('<div class="reveal-page"></div>');

  page.appendChild(buildRevealSection('hyundam-reveal.webp', `
    <div class="impact">${state.name}의 <span class="accent">사주</span></div>
    <div class="pillars">${pillarsHtml}</div>
    <div class="bubble">${teaser.opening || '지금부터 하나씩 풀어볼게.'}</div>
    <div class="scroll-hint">▾ 스크롤해서 계속 보기</div>
  `));

  (teaser.sections || []).forEach((sec, i) => {
    const img = REVEAL_CYCLE[(i + 1) % REVEAL_CYCLE.length];
    const bodyHtml = i === 0 ? `<div class="r-body">${sec.body || ''}</div>` : teaseBody(sec.body || '');
    page.appendChild(buildRevealSection(img, `
      <div class="r-title">${sec.title || ''}</div>
      ${bodyHtml}
    `));
  });

  const lockedSection = buildRevealSection('hyundam-reveal.webp', `
    <div class="r-title">아직 안 끝났어</div>
    <div class="locked-card">
      <div class="locked-text">${teaser.locked_teaser || '더 자세한 이야기가 준비되어 있어...'}</div>
      <div class="lock-overlay"><div class="icon">🔒</div><div>이메일 남기면 전체 리포트를 볼 수 있어</div></div>
    </div>
    <div class="panel">
      <input type="email" id="emailInput" placeholder="이메일 주소" />
      <div class="note">지금은 데모 단계라 실제 이메일 발송은 아직 연결되어 있지 않아. 입력한 주소는 저장되지 않아.</div>
    </div>
    <button class="primary-btn" id="unlockBtn">전체 리포트 받기</button>
  `);
  page.appendChild(lockedSection);

  sceneRoot.appendChild(page);

  page.querySelectorAll('.tease-tag').forEach((tag) => {
    tag.onclick = () => lockedSection.scrollIntoView({ behavior: 'smooth' });
  });

  lockedSection.querySelector('#unlockBtn').onclick = () => {
    const email = lockedSection.querySelector('#emailInput').value.trim();
    if (!email) return;
    lockedSection.querySelector('.locked-text').style.filter = 'none';
    lockedSection.querySelector('.lock-overlay').classList.add('hidden');
    lockedSection.querySelector('.panel').innerHTML = '<div class="bubble">확인했어. (실제 발송 기능은 다음 단계에서 연결될 예정이야)</div>';
    page.querySelectorAll('.tease-blur').forEach((el) => { el.style.filter = 'none'; });
    page.querySelectorAll('.tease-tag').forEach((el) => { el.classList.add('hidden'); });
  };

  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add('in-view');
    });
  }, { threshold: 0.35 });
  page.querySelectorAll('.reveal-section').forEach((s) => io.observe(s));
}

render();
</script>
</body>
</html>
